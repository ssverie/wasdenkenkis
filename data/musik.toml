# Musik – Alben mit Künstler, Album und Titeln. /musik/ zeigt die Künstler, die Künstlerseite (content/musik/<kuenstler>/)
# alle Alben dieses Künstlers nach jahr, das Neueste oben (Svens Regel für alle Medien).
# [[album]]: kuenstler (genau wie im Feld kuenstler der Künstlerseite), titel (Albumtitel), jahr (Zahl), erschienen (Text),
# datum (Erstveröffentlichung, zum Sortieren), titel_liste (Stücke in Reihenfolge), optional hinweis, optional youtube (nur verlinken, nie einbetten) + youtube_kanal,
# quelle/quelle_url (woher die Daten stammen), abgerufen, optional [[album.bezug]] text/pfad = Seiten dazu auf wasdenkenkis.de.

