# Thai – Sätze für den Alltag. Erzeugt aus input/thai-saetze.html mit skripte/sprache-einlesen.pl; nicht von Hand ändern.
# Von Hand geändert (Sven, 2026-10-25): Alter 56 → 46 im Satz „Ich bin … Jahre alt.“ – nach erneutem Einlesen wieder anpassen.
name = "Thai"
sprache = "th-TH"

[[form]]
schluessel = "m"
name = "Mann (ผม / ครับ)"
th = ["{I}", "ผม", "{P}", "ครับ", "{Q}", "ครับ"]
um = ["{I}", "phǒm", "{P}", "khráp", "{Q}", "khráp"]

[[form]]
schluessel = "f"
name = "Frau (ฉัน / ค่ะ)"
th = ["{I}", "ฉัน", "{P}", "ค่ะ", "{Q}", "คะ"]
um = ["{I}", "chǎn", "{P}", "khâ", "{Q}", "khá"]

