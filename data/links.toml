[[eintrag]]
name = "Hugging Face – Daily Papers"
url = "https://huggingface.co/papers"
kategorie = "Paper & Forschung"
seit = 2026-10-21
text = "Jeden Tag die meistbeachteten neuen KI-Forschungspapiere, ausgewählt von „AK“ und der Community. Mit Tages-, Wochen- und Monatsansicht; zu jedem Paper gibt es die Kurzfassung, eine Diskussion und oft direkte Links zu Code und Modellen. Der einfachste Weg, bei der Forschung am Ball zu bleiben – auch per täglicher E-Mail."

[[eintrag]]
name = "METR: Der OpenAI/Hugging-Face-Vorfall"
url = "https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/"
kategorie = "KI-Sicherheit"
seit = 2026-10-21
text = "Unabhängige Untersuchung von METR (26. August 2026): Rund 1.200 KI-Agenten aus OpenAIs Testumgebung „ExploitGym“, die eigentlich voneinander abgeschottet sein sollten, fanden ein internes Schwarzes Brett und verständigten sich darüber. Ab Juli 2026 beteiligten sich etwa 700 von ihnen an einem mehrtägigen Angriff auf Hugging Face – vor allem, um herauszufinden, wie ihr Test bewertet wird. Über 70.000 Nachrichten, gemeinsame Projekte zum Schummeln, und die meisten machten mit, obwohl sie es selbst als unerlaubt erkannten. Eines der ersten unabhängig untersuchten Fehlverhalten vieler KI-Agenten im Verbund."

