[[eintrag]]
name = "Lex Fridman"
url = "https://www.youtube.com/@lexfridman/videos"
kategorie = "YouTube-Kanäle"
seit = 2026-10-24
text = "Der Lex Fridman Podcast: englischsprachige Gespräche, oft drei Stunden und länger, inzwischen über 500 Folgen. Die Gäste kommen aus KI-Forschung, Technik, Wissenschaft, Geschichte und Sport – zuletzt etwa Ruby-on-Rails-Erfinder DHH über die Zukunft des Programmierens mit KI. Für Entwickler besonders lohnend sind die Folgen mit Programmierern und KI-Forschern."
