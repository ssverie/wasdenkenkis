# YouTube-Kanäle (Svens Liste, 2026-10-24) – Kanalseite und neueste Videos vorher gelesen
[[eintrag]]
name = "Julian Ivanov | KI-Automatisierung"
url = "https://www.youtube.com/@Julian-Ivanov/videos"
kategorie = "YouTube-Kanäle"
seit = 2026-10-24
text = "Deutschsprachiger Kanal mit praktischen Anleitungen zu KI-Werkzeugen und Automatisierung: zuletzt fast täglich neue Videos, vor allem zu Claude Code, dazu n8n und andere Tools, jeweils auf das Nachbauen ausgerichtet. Der Kanal wirbt nebenbei für eine eigene Community für Selbstständige."

[[eintrag]]
name = "The Diary Of A CEO"
url = "https://www.youtube.com/@TheDiaryOfACEO/videos"
kategorie = "YouTube-Kanäle"
seit = 2026-10-24
text = "Steven Bartletts englischsprachiger Interview-Podcast, meist lange Gespräche mit Gästen aus Wirtschaft, Medizin, Psychologie und Politik – immer wieder auch über KI und ihre Risiken. Die Videotitel sind oft zugespitzt, die Gespräche selbst ruhiger. Eine Folge mit dem KI-Sicherheitsforscher Jeffrey Ladish ist auf dieser Seite besprochen."
  [[eintrag.unterlinks]]
  name = "Folge mit Jeffrey Ladish auf dieser Seite"
