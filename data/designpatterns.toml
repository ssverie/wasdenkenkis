[[muster]]
nummer = 1
gruppe = "erzeugung"
schluessel = "abstract-factory"
name = "Abstract Factory"
text = "Familien verwandter Objekte erzeugen, ohne konkrete Klassen zu nennen"
sogehts = "Der Ablauf oben spielt main() aus dem Quellcode Schritt für Schritt nach. Das Klassendiagramm zeigt die GoF-Rollen, aktive Klassen sind hervorgehoben. Darunter laufen der Aufrufstapel, die entstehenden Objekte und die Konsole mit, im Code ist die gerade laufende Zeile markiert. Mit „java AbstractFactory.java mac“ startet dasselbe Programm mit der Mac-Familie. Achte darauf, dass in einem Lauf nie Teile beider Familien entstehen."

[[muster]]
nummer = 2
gruppe = "erzeugung"
schluessel = "builder"
name = "Builder"
text = "komplexe Objekte schrittweise aufbauen, Konstruktion von Repräsentation getrennt"
sogehts = "Der Ablauf oben spielt main() aus dem Quellcode Schritt für Schritt nach. Man sieht, wie der Builder seine Felder sammelt, wie jede Methode this zurückgibt und wie erst build() die unveränderliche Pizza erzeugt. Dazu kommen die beiden Rezepte des Directors und der Fehlerfall ohne Belag. „Bis Ausgabe“ springt von einer Konsolenzeile zur nächsten."

[[muster]]
nummer = 3
gruppe = "erzeugung"
schluessel = "factory-method"
name = "Factory Method"
text = "Unterklassen entscheiden, welche Klasse instanziiert wird"
sogehts = "Der Ablauf oben spielt main() aus dem Quellcode Schritt für Schritt nach. Achte auf den Aufrufstapel: planeLieferung() läuft in der Oberklasse Logistik, ruft aber erzeugeTransport() auf, und diese Methode kommt aus der Unterklasse. Im Klassendiagramm leuchten dabei beide Klassen auf. Das Produkt entsteht nur in der Unterklasse, die Oberklasse sieht es bloß als Transport."

[[muster]]
nummer = 4
gruppe = "erzeugung"
schluessel = "prototype"
name = "Prototype"
text = "neue Objekte durch Klonen eines Prototyps"
sogehts = "Der Ablauf oben spielt main() aus dem Quellcode Schritt für Schritt nach. Unter „Objekte im Speicher“ sieht man jede Kopie als eigenes Objekt mit eigener Nummer. Bei der Gruppe „Schild“ entstehen auch neue Teile, das ist die tiefe Kopie. Beim Verschieben ändern sich deshalb nur die Werte der Kopie, die Teile der Vorlage bleiben, wie sie sind. Die letzte Zeile hat eine Überraschung: Gedruckt wird dort nicht die Vorlage selbst, sondern eine frische Kopie von ihr."

[[muster]]
nummer = 5
gruppe = "erzeugung"
schluessel = "singleton"
name = "Singleton"
text = "genau eine Instanz mit globalem Zugriffspunkt"
sogehts = "Der Ablauf oben spielt main() aus dem Quellcode Schritt für Schritt nach. Beim ersten getInstance() lädt die JVM erst die Klasse Holder, und nur dabei läuft der private Konstruktor. Beim zweiten Aufruf passiert nichts mehr davon. Von den 10.000 virtuellen Threads sind drei einzeln zu sehen: Jeder bekommt dieselbe Konfiguration und eine eigene ID. Der Rest folgt in einem Schritt."

[[muster]]
nummer = 6
gruppe = "struktur"
schluessel = "adapter"
name = "Adapter"
text = "inkompatible Schnittstelle an erwartete anpassen"
sogehts = "Der Ablauf oben spielt main() aus dem Quellcode Schritt für Schritt nach. Der Client anzeigen() ruft immer nur celsius() auf. Was dahinter passiert, zeigt der Aufrufstapel: Beim Objekt-Adapter geht der Aufruf an ein zweites Objekt weiter, beim Klassen-Adapter läuft die geerbte Methode auf demselben Objekt, beim Lambda reicht ein einziger Ausdruck. Die Zahlen stehen wie auf der Seite mit Punkt, auf einem deutsch eingestellten Rechner schreibt printf ein Komma."

[[muster]]
nummer = 7
gruppe = "struktur"
schluessel = "bridge"
name = "Bridge"
text = "Abstraktion und Implementierung entkoppeln, beide unabhängig variierbar"
sogehts = "Der Ablauf oben spielt main() aus dem Quellcode Schritt für Schritt nach. Im Klassendiagramm liegt die Brücke waagerecht: links das „Was“ (Info, Alarm), rechts das „Wie“ (E-Mail, SMS), dazwischen das Feld kanal. Im Aufrufstapel sieht man bei jeder Meldung beide Seiten übereinander: oben läuft der Kanal, darunter die Benachrichtigung, die ihn benutzt. Alarm wiederholt die Meldung, die SMS kürzt sie, und jede Seite weiß nur von ihrem eigenen Teil."

[[muster]]
nummer = 8
gruppe = "struktur"
schluessel = "composite"
name = "Composite"
text = "Teil-Ganzes-Hierarchien als Baum, Einzel- und Gruppenobjekte gleich behandeln"
sogehts = "Der Ablauf oben spielt main() aus dem Quellcode Schritt für Schritt nach. Zuerst entsteht der Baum, und zwar von innen nach außen, weil Java die Argumente vor dem Konstruktor auswertet. Bei der ersten Zeile von zeige() ist die Rekursion vollständig zu sehen: Im Aufrufstapel fragt projekt den Ordner bilder, bilder fragt fotos, fotos fragt die Dateien. Danach laufen dieselben Rekursionen in einem Schritt, sonst würde der Ablauf sehr lang. Zum Schluss zählt zaehleDateien() mit Pattern Matching im switch. Die Zahlen stehen wie auf der Seite mit Punkt, auf einem deutsch eingestellten Rechner schreibt das Programm ein Komma."

[[muster]]
nummer = 9
gruppe = "struktur"
schluessel = "decorator"
name = "Decorator"
text = "Verhalten dynamisch hinzufügen durch Umhüllen"
sogehts = "Der Ablauf oben spielt main() aus dem Quellcode Schritt für Schritt nach. Jede Bestellung baut ihr Getränk von innen nach außen. Danach sieht man im Aufrufstapel, wie eine Frage durch die Hüllen nach innen wandert: Jeder Decorator fragt erst sein Feld innen und ergänzt dann seinen Teil auf dem Rückweg. Bei den Bestellungen 4 und 5 ist der Preis Schritt für Schritt zu sehen, dort zählt die Reihenfolge. Am Ende legt andThen() dieselben Hüllen um Funktionen."

[[muster]]
nummer = 10
gruppe = "struktur"
schluessel = "facade"
name = "Facade"
text = "vereinfachte Schnittstelle zu einem Subsystem"
sogehts = "Der Ablauf oben spielt main() aus dem Quellcode Schritt für Schritt nach. main ruft pro Bestellung genau eine Methode auf: shop.bestelle(). Was dahinter geschieht, zeigt der Aufrufstapel: Die Fassade fragt Lager, Preise, Zahlung, Versand und Mail in der richtigen Reihenfolge, im Diagramm leuchten dabei Shop und das gerade gefragte Subsystem. Beim Monitor bricht die Fassade nach der ersten Frage ab und schickt eine Absage. Zurück kommt jedes Mal nur ein Ergebnis, das main mit einem switch auswertet."

[[muster]]
nummer = 11
gruppe = "struktur"
schluessel = "flyweight"
name = "Flyweight"
text = "viele feingranulare Objekte effizient teilen (intrinsischer vs. extrinsischer Zustand)"
sogehts = "Der Ablauf oben spielt main() aus dem Quellcode Schritt für Schritt nach. Die ersten sieben Bäume entstehen einzeln, und zwar genau die, die Java mit new Random(42) pflanzt (der Zufallsgenerator ist nachgerechnet). Bei jeder neuen Art legt die Fabrik ein Baumart-Objekt mit Textur an, bei jeder bekannten liefert sie das vorhandene aus dem cache. Die übrigen 99.993 Bäume folgen in einem Schritt. Im Speicher bleibt es bei drei Baumarten, egal wie groß der Wald wird."

