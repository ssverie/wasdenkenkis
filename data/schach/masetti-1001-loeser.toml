# Lösungsliste zu „1001 Chess Exercises for Beginners“: Antworten verschiedener Löser, festgeschrieben, bevor die
# Lösungen des Buchs eingetragen sind (Sven, 2026-11-03: „mach eine Liste, da kommen dann die anderen noch dazu,
# erstmal nur du, 57“). Angezeigt auf /buchtexte/masetti-1001-loeser/ per Shortcode {{< schach-loeserliste daten="masetti-1001" >}};
# Stellung und (später) Buchlösung aus data/schach/masetti-1001.toml. Antworten nie nachträglich ändern.
# [[teilnehmer]]: kurz (Schlüssel), name (Anzeige), modell, bedingungen (wie gelöst).
# [[antwort]]: nr, wer (= kurz), antwort, sicherheit (sicher | unsicher | nicht gefunden), geloest, notiz,
#              ergebnis (richtig | falsch | anderer Weg | offen). Gezählt wird streng: nur der Zug des Buchs.

[[teilnehmer]]
kurz = "claude-code"
name = "Claude Code (Opus 5.5)"
modell = "Claude Opus 5.5"
bedingungen = "Die Redaktions-Instanz dieser Seite. Hat die Diagramme selbst abgelesen und dabei die Bildunterschriften des Buchs gesehen (halbe Hinweise, z. B. „Double check“); gelöst aus der FEN im Kopf, ohne Engine und ohne das eigene Nachspielskript, ohne die Lösungsseiten."

[[teilnehmer]]
kurz = "opus-agent"
name = "Opus 5.5 (frischer Agent)"
modell = "Claude Opus 5.5"
bedingungen = "Ein frisch gestarteter Unteragent ohne Vorwissen aus dieser Sitzung. Bekam nur die 57 FEN mit „Weiß am Zug, Matt in 1“ – ohne Bildunterschriften – und die Anweisung, im Kopf zu lösen, ohne Dateien, Skripte, Engine oder Web. Kapitel 2: ein neuer frischer Opus-Agent (ein erster Versuch mit allen 129 FEN auf einmal brach an der Längengrenze ab und lieferte nichts), sonst gleiche Bedingungen, „Matt in zwei“; die Aufgaben kamen gleich in drei Teilen (58–100, 101–143, 144–186)."

[[teilnehmer]]
kurz = "sonnet-agent"
name = "Sonnet 5.5 (frischer Agent)"
modell = "Claude Sonnet 5.5"
bedingungen = "Ein frisch gestarteter Unteragent mit Sonnet 5.5, dieselben Bedingungen wie beim Opus-Agenten: nur die 57 FEN, keine Bildunterschriften, im Kopf lösen ohne Werkzeuge. Kapitel 2: alle 129 FEN mit „Weiß am Zug, Matt in zwei“, sonst gleiche Bedingungen; die erste Antwort brach an der Längengrenze ab (über 128.000 Tokens), danach antwortete er in drei Teilen (58–100, 101–143, 144–186) mit knappen Notizen."

