# Franco Masetti, Roberto Messa: 1001 Chess Exercises for Beginners (New in Chess 2012) – Aufgaben als FEN, abgelesen aus
# Svens PDF des Buchs (input\, Scan; die Textschicht ist verschlüsselt, die Diagramme sind JBIG2-Bilder – gelesen über eine
# eigene pdf.js-Ansicht in einem Wegwerf-Ordner, je Seite zwei Ausschnitte in 1,2-facher Größe).
# Prüfen: perl skripte/fen-pruefen.pl data/schach/masetti-1001.toml
# seite = Buchseite der Aufgabe. Die Bildunterschriften des Buchs (halbe Lösungshinweise) bewusst nicht übernommen
# (Sven, 2026-11-03: „nein, keine Hinweise“).
# Lösungen erst eingetragen, nachdem drei Löser fertig waren (Sven, 2026-11-03: „nicht in die Lösungen gucken, lass es
# noch offen“, später „Live und auswerten“). Lösungsteil: Buchseite 125 (= PDF-Seite 107). Kapitel 1: Weiß am Zug, Matt
# in einem Zug; wo das Buch mehrere Mattzüge nennt (20, 23, 41), stehen die weiteren als varianten. Partie/Jahr, wo das
# Buch sie nennt. Alle 57 Lösungen in der abgelesenen Stellung als echtes Matt nachgespielt (loesung-nachspielen 0).
# Rochaderechte, wo König und Türme auf den Ausgangsfeldern stehen (14, 24, 25, 27, 32, 37, 44, 45) – das Buch gibt sie nicht an.
# Kapitel 2 (Matt in zwei, 58–186, Buchseiten 13–23 = PDF-Seiten 12–22) am 2026-11-03 abgelesen, ab Aufgabe 91 in 1,6-facher
# Größe; noch ohne Lösungen (Sven: „bis 186, wie vorhin, nicht nachschauen“). Rochaderechte genauso (59, 60, 78, 79, 98, 120,
# 163, 166, 167, 168).

