# Joe Gallagher: 365 Ways to Checkmate (Gambit 2004) – Aufgaben als FEN, abgelesen aus Svens PDF des Buchs
# (input\, Seiten im PDF-Betrachter des eingebauten Browsers; die Seiten sind Scans, die Lösungen kommen aus der OCR-Textschicht).
# Prüfen: perl skripte/fen-pruefen.pl data/schach/gallagher-365.toml und perl skripte/loesung-nachspielen.pl data/schach/gallagher-365.toml.
# seite = Buchseite der Aufgabe. Lösungen (Buchseite 141 ff.): nur Partie, Turnier und Züge in deutscher Notation, Zählung ab 1
# wie im Buch; die Erklärtexte und Hinweise des Buchs werden nicht übernommen.
# Farbe der Figuren auf den schraffierten Feldern ist im Scan nicht immer eindeutig – im Zweifel aus Lösung und Aufgabentext
# erschlossen (2: Dc3 weiß, 4: Db1 weiß, 5: Db8 und Te8 weiß, 6: Dh5 weiß, 7: De4 weiß, 8: Dd8 und Tf8 weiß, 10: Dg6 weiß;
# ab 11 bei fast jeder Aufgabe mit zwei Damen ebenso). Varianten zusätzlich geprüft (Hauptlinie bis zum Abzweig + Variante).
# 27: König zuerst auf g4 gelesen (stand im Schach) – f4 passt zur Buchvariante 1…Th4+ 2.Kf3. 37: Td8 ist weiß.
# 47: Buch „…Txh2+“, auf h2 steht im Diagramm nichts – als Th2+ eingetragen.
# Level 2 (65–128): Lösungen aus der OCR-Schicht, Zweifelsfälle (81, 82, 83, 84, 85, 86) auf der Lösungsseite im PDF
# nachgelesen. Prüfung fing drei Lesefehler (68: Te1/Df1, 70: Td7 weiß, 83: 1.Dc6) und zwei OCR-Deutungen in Varianten
# (69: 4.Dxg7#, 109: 1…Kf8+ mit Abzugsschach). Unbeteiligte Bauern können bei einzelnen Diagrammen eine Linie danebenstehen.
# Level 3 (129–192): Zweifelsfälle auf den Lösungsseiten nachgelesen (133, 134, 139, 144, 164, 167, 169, 172). Damenfarbe
# nach der Lösung bestimmt bei 133 (Dg7 weiß), 134 (De8 weiß), 139 (De7 weiß), 151, 152, 167 (Da6 weiß), 169 (Dg4 schwarz).
# 188: Das Buch schreibt „Black to play“, die Lösung beginnt mit 1.Da3+ – als Weiß am Zug eingetragen.
# Zwei Buch-Nebenlinien weggelassen, weil sie in der abgelesenen Stellung nicht spielbar sind: 151 (4…Kh8 5.Dxh6+ Dh7
# 6.Df6+ – der weiße König auf h1 stünde im Schach) und 176 (6…Lf6 7.exf6 – kein weißer Bauer auf e5).

