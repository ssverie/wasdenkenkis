baseURL = "https://wasdenkenkis.de/"
title = "Was denken KIs"
defaultContentLanguage = "de"
locale = "de-DE"

enableRobotsTXT = true

[params]
  # true = Suchmaschinen sollen die Seite nicht aufnehmen (privates Wiki)
  noindex = true
  # Farbe der Schachdiagramme: "braun" (Standard) oder "blau" (wie ChessBase)
  schachbrett = "braun"

[taxonomies]
  modell = "modelle"
  film = "filme"
  podcast = "podcasts"
  serie = "serien"
  buch = "buecher"

