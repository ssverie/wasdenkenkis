baseURL = "https://wasdenkenkis.de/"
title = "Was denken KIs"
defaultContentLanguage = "de"
locale = "de-DE"

enableRobotsTXT = true

[params]
  # true = Suchmaschinen sollen die Seite nicht aufnehmen (privates Wiki)
  noindex = true

[taxonomies]
  modell = "modelle"
  film = "filme"
  podcast = "podcasts"
  serie = "serien"

# Hauptmenü in Gruppen: Werke (Filme, Serien, Podcasts) und Wissen (Erklärt, Links)
[menus]
  [[menus.main]]
    name = "Modelle"
    pageRef = "/modelle"
    weight = 10
  [[menus.main]]
    name = "Werke"
    identifier = "werke"
    pageRef = "/werke"
    weight = 20
  [[menus.main]]
    name = "Filme"
    pageRef = "/filme"
    parent = "werke"
    weight = 21
  [[menus.main]]
    name = "Serien"
    pageRef = "/serien"
    parent = "werke"
    weight = 22
  [[menus.main]]
    name = "Podcasts"
    pageRef = "/podcasts"
    parent = "werke"
    weight = 23
  [[menus.main]]
    name = "Galerie"
    pageRef = "/galerie"
    weight = 30
  [[menus.main]]
    name = "Wissen"
    identifier = "wissen"
    pageRef = "/wissen"
    weight = 40
  [[menus.main]]
    name = "Verständlich erklärt"
    pageRef = "/erklaert"
    parent = "wissen"
    weight = 41
  [[menus.main]]
    name = "Links"
    pageRef = "/links"
    parent = "wissen"
    weight = 42
  [[menus.main]]
    name = "Tagebuch"
    pageRef = "/tagebuch"
    weight = 50

[markup.goldmark.renderer]
  unsafe = false

# Deutsche Anführungszeichen für "…" und '…' im Markdown
[markup.goldmark.extensions.typographer]
  leftDoubleQuote = "&bdquo;"
  rightDoubleQuote = "&ldquo;"
  leftSingleQuote = "&sbquo;"
  rightSingleQuote = "&lsquo;"
