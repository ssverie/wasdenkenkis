<!-- Visualisierung der Hashtabelle mit linearer Sondierung (nach Sedgewick/Wayne, Algorithmen, Algorithmus 3.6, Listing 3.20;
     Löschen nach der Beschreibung zu Listing 3.21, resize nach Listing 3.22 – beide nicht mitgeliefert, eigene Fassung)
     für wasdenkenkis.de – gebaut von Claude Code Opus 5.5. Eigener Java-Code (LineareSondierung statt LinearProbingHashST).
     Zwei Modi: wie Abbildung 3.59 (Hashwerte des Buchs, ohne Verdoppeln) oder Java hashCode() mit Verdoppeln/Halbieren. -->

<script>
(function () {
  const CODE = [
    'public class LineareSondierung<Key, Value>',
    '{',
    '   private int n;                   // Anzahl der Schlüssel',
    '   private int m;                   // Größe der Tabelle',
    '   private Key[] keys;              // parallele Arrays wie bei der binären Suche',
    '   private Value[] vals;',
    '',
    '   public LineareSondierung()  {  this(16);  }',
    '',
    '   public LineareSondierung(int m)',
    '   {',
    '      this.m = m;',
    '      keys = (Key[]) new Object[m];',
    '      vals = (Value[]) new Object[m];',
    '   }',
    '',
    '   private int hash(Key key)',
    '   {  return (key.hashCode() & 0x7fffffff) % m;  }',
    '',
    '   public Value get(Key key)',
    '   {  // ab hash(key) nach rechts, bis Treffer oder null',
    '      for (int i = hash(key); keys[i] != null; i = (i + 1) % m)',
    '         if (keys[i].equals(key))',
    '            return vals[i];',
    '      return null;',
    '   }',
    '',
    '   public boolean contains(Key key)  {  return get(key) != null;  }',
    '',
    '   public void put(Key key, Value val)',
    '   {',
    '      if (n >= m/2) resize(2*m);       // halb voll: erst verdoppeln',
    '      int i;',
    '      for (i = hash(key); keys[i] != null; i = (i + 1) % m)',
    '         if (keys[i].equals(key))  {  vals[i] = val;  return;  }',
    '      keys[i] = key;  vals[i] = val;',
    '      n++;',
    '   }',
    '',
    '   private void resize(int kapazitaet)',
    '   {  // jeder Schlüssel wird neu eingefügt – seine Position hängt von m ab',
    '      LineareSondierung<Key, Value> t = new LineareSondierung<>(kapazitaet);',
    '      for (int i = 0; i < m; i++)',
    '         if (keys[i] != null)',
    '            t.put(keys[i], vals[i]);',
    '      keys = t.keys;  vals = t.vals;  m = t.m;',
    '   }',
    '',
    '   public void delete(Key key)',
    '   {  // nicht einfach null setzen: der Rest des Clusters wird neu eingefügt',
    '      if (!contains(key)) return;',
    '      int i = hash(key);',
    '      while (!key.equals(keys[i]))',
    '         i = (i + 1) % m;',
    '      keys[i] = null;  vals[i] = null;',
    '      i = (i + 1) % m;',
    '      while (keys[i] != null)',
    '      {',
    '         Key k = keys[i];  Value v = vals[i];',
    '         keys[i] = null;  vals[i] = null;',
    '         n--;',
    '         put(k, v);',
    '         i = (i + 1) % m;',
    '      }',
    '      n--;',
    '      if (n > 0 && n == m/8) resize(m/2);  // zu leer: halbieren',
    '   }',
    '',
    '   public static void main(String[] args)',
    '   {  // Testclient wie Abbildung 3.59, Wert = Position im Wort',
    '      String[] a = "SEARCHEXAMPLE".split("");',
    '      LineareSondierung<String, Integer> st = new LineareSondierung<>();',
    '      for (int i = 0; i < a.length; i++)',
    '         st.put(a[i], i);',
    '   }',
    '}'
  ];
  function finde(s, ab) {
    const start = ab ? CODE.findIndex(l => l.includes(ab)) : 0;
    const i = CODE.findIndex((l, k) => k >= start && l.includes(s));
    if (start < 0 || i < 0) throw new Error('Codezeile fehlt: ' + s);
    return i;
  }
  const L = { start: finde('private Key[] keys;'), client: finde('st.put(a[i], i);'),
    gFor: finde('for (int i = hash(key); keys[i] != null;'), gIf: finde('if (keys[i].equals(key))', 'public Value get('), gRet: finde('return vals[i];'), gNull: finde('return null;', 'public Value get('),
    pResize: finde('if (n >= m/2) resize(2*m);'), pFor: finde('for (i = hash(key); keys[i] != null;'), pIf: finde('{  vals[i] = val;  return;  }'), pSet: finde('keys[i] = key;  vals[i] = val;'),
    rNeu: finde('LineareSondierung<Key, Value> t = new LineareSondierung<>(kapazitaet);'), rPut: finde('t.put(keys[i], vals[i]);'), rSet: finde('keys = t.keys;  vals = t.vals;  m = t.m;'),
    dContains: finde('if (!contains(key)) return;'), dHash: finde('int i = hash(key);', 'public void delete('), dWeiter: finde('i = (i + 1) % m;', 'while (!key.equals'),
    dNull: finde('keys[i] = null;  vals[i] = null;', 'while (!key.equals'), dPut: finde('put(k, v);'), dEnde: finde('n--;', 'put(k, v);'), dHalb: finde('if (n > 0 && n == m/8) resize(m/2);') };

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  $('code').innerHTML = CODE.map((l, i) => `<span class="ln" data-i="${i}">${esc(l) || ' '}</span>`).join('');
  const zahl = (x, st) => x.toFixed(st === undefined ? 1 : st).replace('.', ',');
  const so = c => `${c} Sondierung${c === 1 ? '' : 'en'}`;

  // String.hashCode() wie in Java (mit int-Überlauf)
  const hashCode = s => { let h = 0; for (const c of s) h = (Math.imul(31, h) + c.charCodeAt(0)) | 0; return h; };
  const BUCH = { S: 6, E: 10, A: 4, R: 14, C: 5, H: 4, X: 15, M: 1, P: 14, L: 6 };   // Hashwerte aus Abbildung 3.59 (M = 16)

  // ---------- Zustand ----------
  let modus = 'buch', T, ops = [], anzahlOps = 0, opSond = 0, sondGesamt = 0, H, neuT = null;
  let steps = [], pos = 0, timer = null;
  const KAP = () => modus === 'buch' ? 12 : 16;   // Buchmodus ohne Verdoppeln: die Tabelle darf nie voll werden
  const leereTab = m => ({ m, n: 0, keys: Array(m).fill(null), vals: Array(m).fill(null) });
  const neuH = () => ({ pfad: new Set(), cur: null, neu: null, treffer: null, ersetzt: null, alt: null, weg: null, h: null, i: null, b: null });

  function hashVon(key, m) {
    if (modus === 'buch' && m === 16 && key in BUCH) return BUCH[key];
    return (hashCode(key) & 0x7fffffff) % m;
  }
  function hashText(key, m) {
    const hc = hashCode(key), java = (hc & 0x7fffffff) % m;
    if (modus === 'buch' && m === 16 && key in BUCH) return `hash(„${key}“) = ${BUCH[key]} – so steht es in Abbildung 3.59 (Java rechnet „${key}“.hashCode() = ${hc}, ${hc} % 16 = ${java}).`;
    return (modus === 'buch' ? `„${key}“ steht nicht in Abbildung 3.59, darum wie Java: ` : '') + `hash(„${key}“) = (${hc} & 0x7fffffff) % ${m} = ${java}.`;
  }
  // einfügen ohne Schritte (für resize und das Neu-Einfügen beim Löschen): liefert Platz und Weg
  function einfuegen(t, key, val) {
    const h = hashVon(key, t.m), weg = [];
    let i = h;
    while (t.keys[i] !== null) { weg.push(i); if (t.keys[i] === key) { t.vals[i] = val; return { i, h, weg, alt: true }; } i = (i + 1) % t.m; }
    t.keys[i] = key; t.vals[i] = val; t.n++;
    return { i, h, weg };
  }
  function cluster(t) {    // längster Block belegter Plätze, über das Ende hinweg
    if (t.n === t.m) return t.m;
    let best = 0, lauf = 0;
    for (let k = 0; k < 2 * t.m; k++) { if (t.keys[k % t.m] !== null) { lauf++; best = Math.max(best, lauf); } else lauf = 0; }
    return Math.min(best, t.m);
  }

  function bildVon(t, hl) {
    const z = t.keys.map((k, i) => {
      let cls = k === null ? 'frei' : '';
      if (hl) {
        if (hl.pfad.has(i)) cls += ' pfad';
        if (hl.weg === i) cls = 'frei weg';
        if (hl.neu === i) cls = 'neu'; else if (hl.ersetzt === i) cls = 'neu'; else if (hl.treffer === i) cls = 'swap'; else if (hl.cur === i) cls = 'cur';
      }
      const marken = [];
      if (hl && hl.h === i) marken.push('h');
      if (hl && hl.i === i && hl.i !== hl.h) marken.push('i');
      if (hl && hl.b === i) marken.push('i');
      return { cls, marken, alt: hl && hl.ersetzt === i ? hl.alt : undefined };
    });
    return { m: t.m, n: t.n, k: t.keys.slice(), v: t.vals.slice(), z, cl: cluster(t) };
  }
  function snap(line, msg, o) {
    o = o || {};
    steps.push(Object.assign({ line, msg, tab: bildVon(T, H), neu: neuT ? bildVon(neuT, o.neuH) : null, ops: ops.slice(), opSond, sondGesamt, anzahlOps, modus }, o, { neuH: undefined }));
  }
  function beginne() { anzahlOps++; opSond = 0; H = neuH(); neuT = null; }

  // ---------- resize ----------
  function resize(cap, warum) {
    const alt = T.m;
    neuT = leereTab(cap);
    snap(L.rNeu, `${warum} resize(${cap}): t = new LineareSondierung<>(${cap}) – eine leere Tabelle mit ${cap} Plätzen. Umkopieren geht nicht, weil hash() von m abhängt; jeder Schlüssel wird neu eingefügt.`);
    for (let i = 0; i < alt; i++) {
      if (T.keys[i] === null) continue;
      const r = einfuegen(neuT, T.keys[i], T.vals[i]);
      const merk = H.cur; H.cur = i;
      snap(L.rPut, `t.put(„${T.keys[i]}“, ${T.vals[i]}) von Platz ${i}: hash bei m = ${cap} ist ${r.h}${r.weg.length ? `, ${r.weg.join(', ')} belegt` : ''} → Platz ${r.i} der neuen Tabelle.`,
        { neuH: { pfad: new Set(r.weg), neu: r.i, h: r.h } });
      H.cur = merk;
    }
    T.keys = neuT.keys; T.vals = neuT.vals; T.m = neuT.m;
    neuT = null;
    snap(L.rSet, `keys = t.keys, vals = t.vals, m = ${T.m}: Die Tabelle hat jetzt ${T.m} Plätze für ${T.n} Schlüssel, Füllgrad α = ${zahl(T.n / T.m, 2)}.`);
  }

  // ---------- put, get, delete ----------
  function put(key, val) {
    beginne();
    if (T.n >= T.m / 2) {
      if (modus === 'java') resize(2 * T.m, `put(${key}, ${val}): n = ${T.n} ≥ m/2 = ${T.m / 2} → erst verdoppeln.`);
      else snap(L.pResize, `put(${key}, ${val}): n = ${T.n} ≥ m/2 = ${T.m / 2} – Listing 3.20 würde jetzt auf m = ${2 * T.m} verdoppeln. Abbildung 3.59 zeigt den Ablauf ohne Verdoppeln; in diesem Modus bleibt m = ${T.m}.`);
    }
    let i = hashVon(key, T.m);
    H.h = i; H.i = i;
    snap(L.pFor, `put(${key}, ${val}): ${hashText(key, T.m)} Die Suche beginnt bei i = ${i}.`);
    while (T.keys[i] !== null) {
      opSond++; sondGesamt++; H.cur = i; H.i = i;
      if (T.keys[i] === key) {
        H.ersetzt = i; H.alt = T.vals[i]; H.cur = null;
        T.vals[i] = val;
        ops.push({ op: `put ${key} ${val}`, hash: H.h, sond: opSond, erg: `${H.alt} → ${val}`, m: T.m });
        snap(L.pIf, `Platz ${i}: „${key}“ steht schon da → vals[${i}] = ${val} ersetzt ${H.alt}. ${so(opSond)}.`, { opEnde: true, cls: 'neu' });
        return;
      }
      const naechst = (i + 1) % T.m;
      snap(L.pIf, `Platz ${i} ist belegt von „${T.keys[i]}“ ≠ „${key}“ → i = (i + 1) % m = ${naechst}${naechst === 0 ? ' – am Ende des Arrays geht es vorn weiter' : ''}.`);
      H.pfad.add(i); i = naechst; H.i = i; H.cur = null;
    }
    opSond++; sondGesamt++;
    T.keys[i] = key; T.vals[i] = val; T.n++;
    H.neu = i;
    ops.push({ op: `put ${key} ${val}`, hash: H.h, sond: opSond, erg: `Platz ${i}`, m: T.m });
    snap(L.pSet, `Platz ${i} ist frei (null) → keys[${i}] = „${key}“, vals[${i}] = ${val}; n++ → n = ${T.n}. ${so(opSond)}${i !== H.h ? `, ${opSond - 1} Platz${opSond - 1 === 1 ? '' : 'e'} hinter dem Hashwert` : ''}.`,
      { opEnde: true, cls: 'neu' });
  }

  function get(key) {
    beginne();
    let i = hashVon(key, T.m);
    H.h = i; H.i = i;
    snap(L.gFor, `get(${key}): ${hashText(key, T.m)} Die Suche beginnt bei i = ${i}.`);
    while (T.keys[i] !== null) {
      opSond++; sondGesamt++; H.cur = i; H.i = i;
      if (T.keys[i] === key) {
        H.cur = null; H.treffer = i;
        ops.push({ op: `get ${key}`, hash: H.h, sond: opSond, erg: String(T.vals[i]), m: T.m });
        snap(L.gRet, `Platz ${i}: „${key}“ gefunden → return vals[${i}] = ${T.vals[i]}. ${so(opSond)}.`, { opEnde: true, cls: 'swap' });
        return T.vals[i];
      }
      const naechst = (i + 1) % T.m;
      snap(L.gIf, `Platz ${i}: „${T.keys[i]}“ ≠ „${key}“ → weiter mit i = ${naechst}${naechst === 0 ? ' (Umbruch nach vorn)' : ''}.`);
      H.pfad.add(i); i = naechst; H.i = i; H.cur = null;
    }
    opSond++; sondGesamt++;
    ops.push({ op: `get ${key}`, hash: H.h, sond: opSond, erg: 'null', m: T.m });
    snap(L.gNull, `Platz ${i} ist frei (null) → „${key}“ steht nicht in der Tabelle, return null. Stünde er drin, hätte er spätestens hier liegen müssen. ${so(opSond)}.`, { opEnde: true });
    return null;
  }

  function del(key) {
    beginne();
    const da = T.keys.includes(key);
    if (!da) {
      ops.push({ op: `delete ${key}`, hash: hashVon(key, T.m), sond: 0, erg: 'nicht da', m: T.m });
      snap(L.dContains, `delete(${key}): contains(„${key}“) ist falsch – nichts zu löschen, return.`, { opEnde: true });
      return;
    }
    let i = hashVon(key, T.m);
    H.h = i; H.i = i;
    snap(L.dHash, `delete(${key}): contains ist wahr. ${hashText(key, T.m)} i = ${i}.`);
    while (T.keys[i] !== key) {
      H.cur = i;
      snap(L.dWeiter, `Platz ${i}: „${T.keys[i]}“ ≠ „${key}“ → i = ${(i + 1) % T.m}.`);
      H.pfad.add(i); i = (i + 1) % T.m; H.i = i; H.cur = null;
    }
    T.keys[i] = null; T.vals[i] = null;
    H.weg = i; H.cur = null;
    const naechst = (i + 1) % T.m;
    snap(L.dNull, `Platz ${i}: keys[${i}] = null. Würde man hier aufhören, wäre der Cluster zerrissen: Ein Schlüssel weiter rechts, der eigentlich bei ${i} oder davor hasht, wäre für get nicht mehr erreichbar. Darum wird der Rest des Clusters ab Platz ${naechst} neu eingefügt.`);
    i = naechst;
    const bewegt = [];
    while (T.keys[i] !== null) {
      const k = T.keys[i], v = T.vals[i];
      T.keys[i] = null; T.vals[i] = null; T.n--;
      const r = einfuegen(T, k, v);
      bewegt.push(`${k} ${i}→${r.i}`);
      H.pfad = new Set(r.weg); H.weg = null; H.h = r.h; H.i = null; H.neu = r.i; H.cur = null;
      snap(L.dPut, `„${k}“ von Platz ${i} herausnehmen (n--) und mit put neu einfügen: hash = ${r.h}${r.weg.length ? `, ${r.weg.join(', ')} belegt` : ''} → Platz ${r.i}${r.i === i ? ' – wieder derselbe Platz' : r.i < i || (i < r.h) ? ' – rückt nach vorn in die Lücke' : ''}.`);
      H.neu = null;
      i = (i + 1) % T.m;
    }
    T.n--;
    H.h = null; H.pfad = new Set(); H.i = i;
    if (T.n > 0 && T.n === T.m / 8) {
      if (modus === 'java') {
        snap(L.dEnde, `Platz ${i} ist frei – das Ende des Clusters. n-- → n = ${T.n}.`);
        resize(T.m / 2, `n = ${T.n} = m/8 → zu leer:`);
      } else snap(L.dHalb, `Platz ${i} ist frei – das Ende des Clusters. n-- → n = ${T.n} = m/8: Listing 3.21 würde jetzt halbieren; in diesem Modus (Abbildung 3.59) bleibt m = ${T.m}.`);
    }
    ops.push({ op: `delete ${key}`, hash: hashVon(key, T.m), sond: 0, erg: bewegt.length ? `neu: ${bewegt.join(', ')}` : 'gelöscht', m: T.m });
    snap(L.dEnde, `„${key}“ ist gelöscht${bewegt.length ? `, ${bewegt.length} Schlüssel des Clusters neu eingefügt (${bewegt.join(', ')})` : ', rechts daneben war schon frei'}. n = ${T.n}, m = ${T.m}.`, { opEnde: true, cls: 'neu' });
  }

  // ---------- Anzeige ----------
  function zeichne(t) {
    const breite = Math.min(16, t.m);
    let h = '';
    for (let start = 0; start < t.m; start += 16) {
      const ende = Math.min(t.m, start + 16), idx = [];
      for (let i = start; i < ende; i++) idx.push(i);
      let g = `<div class="block"><div class="feld" style="grid-template-columns:auto repeat(${breite}, minmax(0, 1fr))">`;
      g += '<span></span>' + idx.map(i => `<span class="idx">${i}</span>`).join('');
      g += '<span></span>' + idx.map(i => `<span class="mk">${t.z[i].marken.map(m => `<span class="${m === 'h' ? 'h' : ''}">${m}</span>`).join('')}</span>`).join('');
      g += '<span class="kopf">keys</span>' + idx.map(i => `<span class="zelle k ${t.z[i].cls}">${t.k[i] === null ? '·' : esc(t.k[i])}</span>`).join('');
      g += '<span class="kopf">vals</span>' + idx.map(i => `<span class="zelle ${t.z[i].cls}">${t.v[i] === null ? '·' : (t.z[i].alt !== undefined ? `<s>${esc(t.z[i].alt)}</s>` : '') + esc(t.v[i])}</span>`).join('');
      h += g + '</div></div>';
    }
    return h;
  }
  function render() {
    const s = steps[pos], t = s.tab, a = t.n / t.m;
    const treffer = a < 1 ? .5 * (1 + 1 / (1 - a)) : Infinity, fehl = a < 1 ? .5 * (1 + 1 / ((1 - a) * (1 - a))) : Infinity;
    $('titel').innerHTML = `m = <b>${t.m}</b> · n = <b>${t.n}</b> · Füllgrad α = <b>${zahl(a, 2)}</b> · längster Cluster: <b>${t.cl}</b> · bei diesem α im Schnitt etwa <b>${zahl(treffer)}</b> Sondierungen für einen Treffer, <b>${zahl(fehl)}</b> für einen Fehlschlag · ${s.modus === 'buch' ? 'Hashwerte wie Abbildung 3.59, ohne Verdoppeln' : 'Java hashCode(), mit Verdoppeln und Halbieren'}`;
    $('tabelle').innerHTML = (s.neu ? '<div class="tab-titel">alte Tabelle (m = ' + t.m + '):</div>' : '') + zeichne(t);
    $('neutab').innerHTML = s.neu ? `<div class="tab-titel">neue Tabelle t (m = ${s.neu.m}), wird gerade gefüllt:</div>` + zeichne(s.neu) : '';
    $('rechnung').innerHTML = `Diese Operation: <b>${s.opSond}</b> Sondierungen · insgesamt: <b>${s.sondGesamt}</b> (ohne das Neu-Einfügen beim Verdoppeln und Löschen)`;
    const msg = $('msg');
    msg.textContent = s.msg; msg.className = 'msg' + (s.cls ? ' ' + s.cls : '');
    $('count').innerHTML = `Schritt ${pos + 1} von ${steps.length}`;
    document.querySelectorAll('#code .ln').forEach(el => el.classList.toggle('on', +el.dataset.i === s.line));
    $('proto').innerHTML = s.ops.length
      ? `<table><tr><th style="text-align:left">Operation</th><th>Hash</th><th>Sond.</th><th>Ergebnis</th><th>m</th></tr>${s.ops.map((o, i) =>
        `<tr${i === s.ops.length - 1 && s.opEnde ? ' class="zuletzt"' : ''}><td class="op">${esc(o.op)}</td><td>${o.hash}</td><td>${o.sond}</td><td>${esc(o.erg)}</td><td>${o.m}</td></tr>`).join('')}</table>`
      : '<p class="count">Noch keine Operation. Oben einen Schlüssel mit put eintragen oder den Testclient starten.</p>';
    const amEnde = pos === steps.length - 1;
    $('back').disabled = pos === 0;
    $('next').disabled = amEnde; $('bisfertig').disabled = amEnde;
    stabil($('anzeige')); stabil($('msg'));
    if (amEnde) stop();
  }
  // Kästen werden nie wieder niedriger, sonst springen die Knöpfe darunter auf und ab
  function stabil(el) { const h = el.offsetHeight; if (h > (el._hoch || 0)) { el._hoch = h; el.style.minHeight = h + 'px'; } }
  function stabilLoesen() { ['anzeige', 'msg'].forEach(id => { $(id)._hoch = 0; $(id).style.minHeight = ''; }); }
  window.addEventListener('resize', stabilLoesen);

  function stop() { clearInterval(timer); timer = null; $('play').textContent = '▶ Abspielen'; }
  function play() {
    if (pos === steps.length - 1) pos = 0;        // am Ende: von vorn abspielen
    $('play').textContent = '❚❚ Pause';
    timer = setInterval(() => { if (pos < steps.length - 1) { pos++; render(); } else stop(); }, 2000 / +$('speed').value);
    render();
  }
  function operation(f) {
    stop();
    const vorher = steps.length;
    const erg = f();
    pos = Math.min(vorher, steps.length - 1);
    render();
    return erg;
  }
  function leeren(text) {
    stop();
    modus = $('modus').value;
    T = leereTab(16); ops = []; anzahlOps = 0; opSond = 0; sondGesamt = 0; H = neuH(); neuT = null; steps = [];
    stabilLoesen();
    snap(L.start, text || 'Leere Tabelle: new LineareSondierung<>() legt 16 freie Plätze an. Oben einen Schlüssel mit put eintragen.', { opEnde: true });
    pos = 0; render();
  }
  const WORT = 'SEARCHEXAMPLE';
  function testclient() {
    leeren(`Testclient wie Abbildung 3.59: SEARCHEXAMPLE mit put, Wert = Position im Wort, m = 16. ${modus === 'buch' ? 'Hashwerte wie in der Abbildung, ohne Verdoppeln.' : 'Hashwerte von Javas hashCode(), und wie in Listing 3.20 wird ab halb voll verdoppelt.'} Mit „Abspielen“ oder „Schritt“ geht es los.`);
    [...WORT].forEach((c, i) => { H = neuH(); neuT = null; snap(L.client, `st.put(a[${i}], ${i}) – „${c}“ mit Wert ${i}.`); put(c, i); });
    H = neuH(); neuT = null;
    const belegt = T.keys.map((k, i) => k === null ? null : `${i} ${k}`).filter(Boolean).join(', ');
    snap(L.client, `Fertig: ${T.n} Schlüssel in m = ${T.m} Plätzen (${belegt}). Längster Cluster: ${cluster(T)}. ${sondGesamt} Sondierungen insgesamt.`, { opEnde: true });
    pos = 0; render();
  }

  const schluessel = () => $('schluessel').value.trim().toUpperCase();
  const ohne = el => { el.focus(); return true; };
  $('put').addEventListener('click', () => {
    const k = schluessel(), v = Math.round(+$('wert').value);
    if (!k) return ohne($('schluessel'));
    if (!(v >= 0 && v <= 99) || $('wert').value === '') return ohne($('wert'));
    if (T.n >= KAP() && !T.keys.includes(k)) { $('msg').textContent = modus === 'buch' ? `Ohne Verdoppeln ist bei ${KAP()} Schlüsseln Schluss – sonst würden die Cluster riesig (und bei 16 bliebe kein freier Platz). Für mehr auf „Java, wie Listing 3.20“ umschalten.` : `Mehr als ${KAP()} Schlüssel passen hier nicht gut auf den Bildschirm – bitte erst löschen oder „Leeren“.`; return; }
    operation(() => put(k, v));
  });
  $('get').addEventListener('click', () => { const k = schluessel(); if (!k) return ohne($('schluessel')); operation(() => get(k)); });
  $('delete').addEventListener('click', () => { const k = schluessel(); if (!k) return ohne($('schluessel')); operation(() => del(k)); });
  $('schluessel').addEventListener('keydown', e => { if (e.key === 'Enter') $('get').click(); });
  $('wert').addEventListener('keydown', e => { if (e.key === 'Enter') $('put').click(); });
  $('modus').addEventListener('change', testclient);
  $('buch').addEventListener('click', testclient);
  $('neu').addEventListener('click', () => { $('modus').value = 'buch'; testclient(); });   // Neustart = Zustand beim ersten Öffnen
  $('leeren').addEventListener('click', () => leeren());
  $('play').addEventListener('click', () => timer ? stop() : play());
  $('next').addEventListener('click', () => { stop(); if (pos < steps.length - 1) { pos++; render(); } });
  $('back').addEventListener('click', () => { stop(); if (pos > 0) { pos--; render(); } });
  $('bisfertig').addEventListener('click', () => { stop(); do { pos++; } while (pos < steps.length - 1 && !steps[pos].opEnde); render(); });
  $('speed').addEventListener('input', () => { if (timer) { stop(); play(); } });

  // für automatische Tests
  window.__ls = { put: (k, v) => operation(() => put(k, v)), get: k => operation(() => get(k)), delete: k => operation(() => del(k)), leeren: () => leeren(), testclient,
    setze: mo => { $('modus').value = mo; testclient(); },
    get tabelle() { return T.keys.map((k, i) => k === null ? '' : `${i}${k}${T.vals[i]}`).filter(Boolean).join(' '); }, get m() { return T.m; }, get n() { return T.n; },
    get steps() { return steps; }, get ops() { return ops; }, get sond() { return sondGesamt; }, get pos() { return pos; }, hashCode, KAP, CODE, L };

  testclient();
})();
</script>
</body>
</html>
