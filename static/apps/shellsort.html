<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shellsort</title>
<!-- Visualisierung von Shellsort (nach Sedgewick/Wayne, Algorithmen, Listing 2.8)
     für wasdenkenkis.de – gebaut von Claude Code Opus 5.5. Eigener Java-Code.
     Gemeinsamer Rahmen (Bedienung, Balken, Protokoll) in sortieren/rahmen.js und rahmen.css. -->
<link rel="stylesheet" href="sortieren/rahmen.css?v=1">
</head>
<body>
<div class="wrap"></div>
<script src="sortieren/rahmen.js?v=1"></script>
<script>
(function () {
  const L = { hstart: 6, whileh: 7, fori: 9, test: 10, tausch: 11, hdiv: 12, ende: 14 };
  const inversionen = SortierRahmen.inversionen;
  let folge = [];              // Abstände dieses Laufs, groß nach klein, z. B. [13, 4, 1]

  SortierRahmen.starte({
    code: [
      'public class Shellsort',
      '{',
      '   public static void sortiere(int[] a)',
      '   {  // sortiert a[] aufsteigend',
      '      int n = a.length;',
      '      int h = 1;',
      '      while (h < n / 3) h = 3 * h + 1;   // 1, 4, 13, 40, ...',
      '      while (h >= 1)',
      '      {  // a[] h-sortieren: Insertionsort mit Abstand h',
      '         for (int i = h; i < n; i++)',
      '            for (int j = i; j >= h && a[j] < a[j - h]; j -= h)',
      '               tausche(a, j, j - h);',
      '         h = h / 3;',
      '      }',
      '   }',
      '',
      '   private static void tausche(int[] a, int i, int k)',
      '   {  int t = a[i]; a[i] = a[k]; a[k] = t;  }',
      '}'
    ],
    codeTitel: 'Java (eigene Fassung, nach Listing 2.8)',
    protokollTitel: 'Ablaufprotokoll (nach jedem Durchlauf)',
    groessen: [12, 16, 20], groesse: 16,
    anordnungen: ['zufall', 'fast', 'umgekehrt'],
    legende: [['var(--sortiert)', 'Teilfolge mit Abstand h'], ['var(--neu)', 'a[j], wird eingefügt'],
              ['var(--cur)', 'a[j−h], Vergleichspartner'], ['var(--swap)', 'Tausch']],
    spruenge: [
      { text: 'Bis eingefügt ▶▶', title: 'Bis das aktuelle Element eingefügt ist', bis: s => s.eingefuegt || s.hfertig },
      { text: 'Bis h fertig ▶▶', title: 'Bis der Durchlauf mit diesem h fertig ist', bis: s => s.hfertig }
    ],
    test: '__shell',

    // Der Algorithmus, einmal komplett durchlaufen; jeder Schritt wird festgehalten
    baue(a, n) {
      const steps = [];
      let vergleiche = 0, tausche = 0;
      const proto = [];            // {h, werte, bewegt: Plätze, die sich in diesem Durchlauf geändert haben}
      const snap = (line, o) => steps.push(Object.assign(
        { line, a: a.slice(), vergleiche, tausche, inv: inversionen(a), proto: proto.slice() }, o));
      const start = a.slice();

      let h = 1;
      folge = [1];
      while (h < Math.floor(n / 3)) { h = 3 * h + 1; folge.unshift(h); }
      snap(L.hstart, { msg: `Start: n = ${n}, also ist der größte Abstand h = ${h} (Folge ${folge.slice().reverse().join(', ')}, solange h < n/3 = ${Math.floor(n / 3)}).` });
      while (h >= 1) {
        const vorher = a.slice();
        snap(L.whileh, { h, msg: h === 1
          ? `h = 1: Jetzt läuft ganz normales Insertionsort – auf einem Array, das schon fast sortiert ist.`
          : `h = ${h}: Das Array wird ${h}-sortiert. Jede Teilfolge aus jedem ${h}-ten Element wird für sich mit Insertionsort sortiert.` });
        for (let i = h; i < n; i++) {
          snap(L.fori, { h, i, j: i, msg: `i = ${i}: a[${i}] = ${a[i]} wird in seine Teilfolge (Abstand ${h}) eingefügt.` });
          let j = i;
          while (j >= h) {
            vergleiche++;
            if (a[j] < a[j - h]) {
              snap(L.test, { h, i, j, msg: `${a[j]} < a[${j - h}] = ${a[j - h]} → ${h === 1 ? 'eine Stelle' : h + ' Stellen'} nach links.` });
              [a[j], a[j - h]] = [a[j - h], a[j]];
              tausche++;
              snap(L.tausch, { h, i, j: j - h, swap: [j - h, j], cls: 'swap', msg: `tausche(a, ${j}, ${j - h}): ${a[j - h]} springt von Platz ${j} auf Platz ${j - h}.` });
              j -= h;
            } else {
              snap(L.test, { h, i, j, msg: `${a[j]} ist nicht kleiner als a[${j - h}] = ${a[j - h]} → bleibt auf Platz ${j}.` });
              break;
            }
          }
          if (j < h) snap(L.test, { h, i, j, msg: `j = ${j} < h = ${h}: Vorne in der Teilfolge angekommen, kein weiterer Vergleich.` });
          steps[steps.length - 1].eingefuegt = true;
        }
        const bewegt = a.map((v, k) => v !== vorher[k] ? k : -1).filter(k => k >= 0);
        proto.push({ h, werte: a.slice(), bewegt });
        snap(L.hdiv, { h, hfertig: true, cls: 'swap', msg: `Das Array ist jetzt ${h}-sortiert${h > 1 ? ` – weiter mit h = ${Math.floor(h / 3)}` : ''}.` });
        h = Math.floor(h / 3);
      }
      snap(L.ende, { fertig: true, cls: 'swap', msg: `Fertig: ${vergleiche} Vergleiche, ${tausche} Tausche. Insertionsort bräuchte für dasselbe Array ${inversionen(start)} Tausche.` });
      return steps;
    },

    balken(s, k) {
      if (s.fertig || s.hfertig || s.i == null) return '';
      if (s.swap && (k === s.swap[0] || k === s.swap[1])) return 'swap';
      if (k === s.j) return 'neu';
      if (!s.eingefuegt && s.j >= s.h && k === s.j - s.h) return 'cur';
      if (k <= s.i && (s.i - k) % s.h === 0) return 'sortiert';      // gleiche Teilfolge wie i
      return s.h > 1 ? 'blass' : '';
    },
    marken(s, k) {
      if (s.fertig || s.hfertig || s.i == null) return [];
      const t = [];
      if (k === s.i) t.push(['i', 'i']);
      if (k === s.j) t.push(['neu', 'j']);
      if (!s.eingefuegt && s.j >= s.h && k === s.j - s.h) t.push(['cur', 'j−h']);
      return t;
    },
    kopf(s) {
      return `Abstand <b>h = ${s.h != null ? s.h : '–'}</b> &nbsp; <span class="folge">${folge.map(x =>
        `<span class="${x === s.h && !s.fertig ? 'an' : ''}">${x}</span>`).join('')}</span>`;
    },
    zaehler(s, start) {
      return `Vergleiche: <b>${s.vergleiche}</b> · Tausche: <b>${s.tausche}</b> · Inversionen übrig: <b>${s.inv}</b> · Insertionsort bräuchte <b>${inversionen(start)}</b> Tausche`;
    },
    // Protokoll wie im Buch: Eingabe, dann je Durchlauf das h-sortierte Array; geänderte Plätze hervorgehoben
    protokoll(s, start) {
      const kopf = `<tr><th></th>${start.map((_, k) => `<th>${k}</th>`).join('')}</tr>`;
      const startZeile = `<tr><td class="name">Eingabe</td>${start.map(v => `<td>${v}</td>`).join('')}</tr>`;
      const zeilen = s.proto.map(z => `<tr><td class="name">${z.h}-sortiert</td>${z.werte.map((v, k) =>
        `<td class="${z.bewegt.includes(k) ? 'neu' : 'grau'}">${v}</td>`).join('')}</tr>`).join('');
      return `<table>${kopf}${startZeile}${zeilen}</table>`;
    }
  });
})();
</script>
</body>
</html>
