<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selectionsort</title>
<!-- Visualisierung von Selectionsort (nach Sedgewick/Wayne, Algorithmen, Listing 2.4)
     für wasdenkenkis.de – gebaut von Claude Code Opus 5.5. Eigener Java-Code.
     Gemeinsamer Rahmen (Bedienung, Balken, Protokoll) in sortieren/rahmen.js und rahmen.css. -->
<link rel="stylesheet" href="sortieren/rahmen.css?v=1">
</head>
<body>
<div class="wrap"></div>
<script src="sortieren/rahmen.js?v=1"></script>
<script>
(function () {
  const L = { n: 4, min: 7, vergleich: 9, tausch: 10, ende: 12 };

  SortierRahmen.starte({
    code: [
      'public class Auswahl',
      '{',
      '   public static void sortiere(int[] a)',
      '   {  // sortiert a[] aufsteigend',
      '      int n = a.length;',
      '      for (int i = 0; i < n; i++)',
      '      {  // das Kleinste aus a[i..n-1] kommt nach a[i]',
      '         int min = i;',
      '         for (int j = i + 1; j < n; j++)',
      '            if (a[j] < a[min]) min = j;',
      '         tausche(a, i, min);',
      '      }',
      '   }',
      '',
      '   private static void tausche(int[] a, int i, int k)',
      '   {  int t = a[i]; a[i] = a[k]; a[k] = t;  }',
      '}'
    ],
    codeTitel: 'Java (eigene Fassung, nach Listing 2.4)',
    protokollTitel: 'Ablaufprotokoll (nach jedem Tausch)',
    groessen: [10, 12, 16, 20], groesse: 12,
    anordnungen: ['zufall', 'fast', 'sortiert', 'umgekehrt'],
    legende: [['var(--grau)', 'fertig (links von i)'], ['var(--cur)', 'a[j], wird geprüft'],
              ['var(--neu)', 'a[min], kleinstes bisher'], ['var(--swap)', 'Tausch']],
    spruenge: [{ text: 'Bis Tausch ▶▶', title: 'Bis zum nächsten Tausch', bis: s => s.swap }],
    test: '__selection',

    // Der Algorithmus, einmal komplett durchlaufen; jeder Schritt wird festgehalten
    baue(a, n) {
      const steps = [];
      let vergleiche = 0, tausche = 0;
      const proto = [];            // Zeilen des Ablaufprotokolls: {i, min, werte}
      const snap = (line, o) => steps.push(Object.assign(
        { line, a: a.slice(), vergleiche, tausche, proto: proto.slice() }, o));

      snap(L.n, { msg: `Start: n = ${n}. In jedem Durchlauf i wird das kleinste Element des noch unsortierten Rests a[i..${n - 1}] gesucht und nach a[i] getauscht.` });
      for (let i = 0; i < n; i++) {
        let min = i;
        snap(L.min, { i, min, msg: `Durchlauf i = ${i}: Zuerst gilt a[${i}] = ${a[i]} als kleinstes – min = ${i}.` });
        for (let j = i + 1; j < n; j++) {
          vergleiche++;
          if (a[j] < a[min]) {
            const alt = min;
            min = j;
            snap(L.vergleich, { i, j, min, msg: `a[${j}] = ${a[j]} < a[${alt}] = ${a[alt]} → neues Kleinstes, min = ${j}.` });
          } else {
            snap(L.vergleich, { i, j, min, msg: `a[${j}] = ${a[j]} ist nicht kleiner als a[${min}] = ${a[min]} → min bleibt ${min}.` });
          }
        }
        tausche++;
        const vorher = [a[i], a[min]];
        [a[i], a[min]] = [a[min], a[i]];
        proto.push({ i, min, werte: a.slice() });
        snap(L.tausch, {
          i, min, swap: [i, min], cls: 'swap',
          msg: min === i
            ? `a[${i}] = ${a[i]} ist schon das Kleinste – tausche(a, ${i}, ${i}) tauscht das Element mit sich selbst.`
            : `tausche(a, ${i}, ${min}): ${vorher[1]} kommt nach vorn auf Platz ${i}, ${vorher[0]} wandert auf Platz ${min}. a[0..${i}] ist jetzt fertig.`
        });
      }
      snap(L.ende, { fertig: true, cls: 'swap', msg: `Fertig: ${vergleiche} Vergleiche und ${tausche} Tauschvorgänge – unabhängig davon, wie das Array vorher aussah.` });
      return steps;
    },

    balken(s, k) {
      if (s.swap && (k === s.swap[0] || k === s.swap[1])) return 'swap';
      if (s.fertig || (s.i != null && k < s.i)) return 'grau';
      if (k === s.min) return 'neu';
      if (k === s.j) return 'cur';
      return '';
    },
    marken(s, k) {
      if (s.fertig || s.i == null) return [];
      const t = [];
      if (k === s.i) t.push(['i', 'i']);
      if (k === s.min) t.push(['neu', 'min']);
      if (k === s.j) t.push(['cur', 'j']);
      return t;
    },
    zaehler(s, start) {
      const n = start.length;
      return `Vergleiche: <b>${s.vergleiche}</b> von n(n−1)/2 = <b>${n * (n - 1) / 2}</b> · Tauschvorgänge: <b>${s.tausche}</b> von n = <b>${n}</b>`;
    },
    // Protokoll wie im Buch: Startzeile, dann je Durchlauf i, min und der Inhalt nach dem Tausch
    protokoll(s, start) {
      const kopf = `<tr><th>i</th><th>min</th>${start.map((_, k) => `<th>${k}</th>`).join('')}</tr>`;
      const startZeile = `<tr class="start"><td></td><td></td>${start.map(v => `<td>${v}</td>`).join('')}</tr>`;
      const zeilen = s.proto.map(z => `<tr><td>${z.i}</td><td>${z.min}</td>${z.werte.map((v, k) =>
        `<td class="${k < z.i ? 'grau' : (k === z.i ? 'neu' : '')}">${v}</td>`).join('')}</tr>`).join('');
      return `<table>${kopf}${startZeile}${zeilen}</table>`;
    }
  });
})();
</script>
</body>
</html>
