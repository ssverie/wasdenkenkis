<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insertionsort</title>
<!-- Visualisierung von Insertionsort (nach Sedgewick/Wayne, Algorithmen, Listing 2.5)
     für wasdenkenkis.de – gebaut von Claude Code Opus 5.5. Eigener Java-Code.
     Gemeinsamer Rahmen (Bedienung, Balken, Protokoll) in sortieren/rahmen.js und rahmen.css. -->
<link rel="stylesheet" href="sortieren/rahmen.css?v=1">
</head>
<body>
<div class="wrap"></div>
<script src="sortieren/rahmen.js?v=1"></script>
<script>
(function () {
  const L = { n: 4, fori: 5, test: 7, tausch: 8, ende: 10 };
  const inversionen = SortierRahmen.inversionen;

  SortierRahmen.starte({
    code: [
      'public class Einfuegen',
      '{',
      '   public static void sortiere(int[] a)',
      '   {  // sortiert a[] aufsteigend',
      '      int n = a.length;',
      '      for (int i = 1; i < n; i++)',
      '      {  // a[i] nach links schieben, bis es passt',
      '         for (int j = i; j > 0 && a[j] < a[j - 1]; j--)',
      '            tausche(a, j, j - 1);',
      '      }',
      '   }',
      '',
      '   private static void tausche(int[] a, int i, int k)',
      '   {  int t = a[i]; a[i] = a[k]; a[k] = t;  }',
      '}'
    ],
    codeTitel: 'Java (eigene Fassung, nach Listing 2.5)',
    protokollTitel: 'Ablaufprotokoll (nach jeder Einfügung)',
    groessen: [10, 12, 16, 20], groesse: 12,
    anordnungen: ['zufall', 'fast', 'sortiert', 'umgekehrt'],
    legende: [['var(--sortiert)', 'schon sortiert (links von i)'], ['var(--neu)', 'a[j], wird eingefügt'],
              ['var(--cur)', 'a[j−1], linker Nachbar'], ['var(--swap)', 'Tausch'], ['var(--rest)', 'noch nicht dran']],
    spruenge: [{ text: 'Bis eingefügt ▶▶', title: 'Bis das aktuelle Element eingefügt ist', bis: s => s.eingefuegt }],
    test: '__insertion',

    // Der Algorithmus, einmal komplett durchlaufen; jeder Schritt wird festgehalten
    baue(a, n) {
      const steps = [];
      let vergleiche = 0, tausche = 0;
      const inv0 = inversionen(a);
      const proto = [];            // Zeilen des Ablaufprotokolls: {i, j, werte}
      const snap = (line, o) => steps.push(Object.assign(
        { line, a: a.slice(), vergleiche, tausche, inv: inv0 - tausche, proto: proto.slice() }, o));

      snap(L.n, { msg: `Start: n = ${n}, das Array hat ${inv0} Inversionen. Links von i ist immer alles sortiert; jedes neue Element wird nach links geschoben, bis es passt.` });
      for (let i = 1; i < n; i++) {
        snap(L.fori, { i, j: i, msg: `i = ${i}: a[${i}] = ${a[i]} wird in den sortierten Teil a[0..${i - 1}] eingefügt.` });
        let j = i;
        while (j > 0) {
          vergleiche++;
          if (a[j] < a[j - 1]) {
            snap(L.test, { i, j, msg: `${a[j]} < ${a[j - 1]} → ${a[j]} muss weiter nach links.` });
            [a[j], a[j - 1]] = [a[j - 1], a[j]];
            tausche++;
            snap(L.tausch, { i, j: j - 1, swap: [j - 1, j], cls: 'swap', msg: `tausche(a, ${j}, ${j - 1}): ${a[j - 1]} und ${a[j]} wechseln den Platz. Eine Inversion weniger.` });
            j--;
          } else {
            snap(L.test, { i, j, msg: `${a[j]} ist nicht kleiner als ${a[j - 1]} → die innere Schleife bricht ab, ${a[j]} bleibt auf Platz ${j}.` });
            break;
          }
        }
        // j = 0: Die Schleifenbedingung j > 0 ist falsch, es wird nicht mehr verglichen
        if (j === 0) snap(L.test, { i, j, msg: `j = 0: ${a[0]} ist ganz vorn angekommen, die innere Schleife endet ohne weiteren Vergleich.` });
        proto.push({ i, j, werte: a.slice() });
        snap(L.fori, { i, j, eingefuegt: true, msg: `a[${j}] = ${a[j]} ist eingefügt – a[0..${i}] ist sortiert.` });
      }
      snap(L.ende, { fertig: true, cls: 'swap', msg: `Fertig: ${vergleiche} Vergleiche und ${tausche} Tausche – genau so viele Tausche, wie das Array am Anfang Inversionen hatte (${inv0}).` });
      return steps;
    },

    balken(s, k, pos) {
      if (s.fertig) return 'sortiert';
      if (s.swap && (k === s.swap[0] || k === s.swap[1])) return 'swap';
      if (s.i == null) return pos === 0 && k === 0 ? 'sortiert' : 'rest';
      if (k === s.j) return 'neu';
      if (!s.eingefuegt && k === s.j - 1) return 'cur';
      return k <= s.i ? 'sortiert' : 'rest';
    },
    marken(s, k) {
      if (s.fertig || s.i == null) return [];
      const t = [];
      if (k === s.i) t.push(['i', 'i']);
      if (k === s.j) t.push(['neu', 'j']);
      return t;
    },
    zaehler(s, start) {
      const n = start.length;
      return `Vergleiche: <b>${s.vergleiche}</b> · Tausche: <b>${s.tausche}</b> · Inversionen übrig: <b>${s.inv}</b> · zum Vergleich: n(n−1)/2 = ${n * (n - 1) / 2}`;
    },
    // Protokoll wie im Buch: i, j und der Inhalt nach der Einfügung; neu = hervorgehoben, verschoben = normal, unberührt = grau
    protokoll(s, start) {
      const kopf = `<tr><th>i</th><th>j</th>${start.map((_, k) => `<th>${k}</th>`).join('')}</tr>`;
      const startZeile = `<tr class="start"><td></td><td></td>${start.map(v => `<td>${v}</td>`).join('')}</tr>`;
      const zeilen = s.proto.map(z => `<tr><td>${z.i}</td><td>${z.j}</td>${z.werte.map((v, k) =>
        `<td class="${k === z.j ? 'neu' : (k < z.j || k > z.i ? 'grau' : '')}">${v}</td>`).join('')}</tr>`).join('');
      return `<table>${kopf}${startZeile}${zeilen}</table>`;
    }
  });
})();
</script>
</body>
</html>
