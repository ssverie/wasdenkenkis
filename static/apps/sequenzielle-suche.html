<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sequenzielle Suche (Symboltabelle)</title>
<!-- Visualisierung der Symboltabelle mit ungeordneter verketteter Liste (nach Sedgewick/Wayne, Algorithmen, Algorithmus 3.1,
     Listing 3.4) für wasdenkenkis.de – gebaut von Claude Code Opus 5.5. Eigener Java-Code (SequenzielleSucheST statt
     SequentialSearchST, mit size()); Testclient SEARCHEXAMPLE wie in Abbildung 3.3. Aufbau wie der Bag (bag.html). -->
<link rel="stylesheet" href="sortieren/rahmen.css?v=3">
<style>
  .eingabe input { width: 4.5em; font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .eingabe input#schluessel { width: 5em; text-transform: uppercase; }
  .reihe-titel { font-size: 13px; color: var(--muted); margin: 4px 0 10px; }
  .reihe-titel b { color: var(--text); font-variant-numeric: tabular-nums; }
  .kette { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 22px 0; min-height: 64px; padding-top: 18px; }
  .glied { display: flex; align-items: flex-end; }
  .knoten { position: relative; display: flex; border-radius: 7px; overflow: visible; outline-offset: 1px; }
  .knoten > div { background: var(--bar); padding: 6px 7px; font-size: 14px; text-align: center; font-variant-numeric: tabular-nums; }
  .knoten .key { border-radius: 7px 0 0 7px; font-weight: 700; min-width: 1.6em; }
  .knoten .val { border-left: 2px solid var(--bg); min-width: 1.6em; }
  .knoten .next { border-radius: 0 7px 7px 0; border-left: 2px solid var(--bg); min-width: 1.2em; padding: 6px 5px; color: var(--muted); }
  .knoten .leer { color: var(--muted); font-style: italic; }
  .knoten.neu > div { background: var(--neu); color: #fff; }
  .knoten.cur > div { background: var(--cur); color: #fff; }
  .knoten.swap > div { background: var(--swap); color: #fff; }
  .knoten.besucht { outline: 2px solid var(--text); }
  .knoten.grau { opacity: .4; }
  @media (prefers-color-scheme: dark) {
    .knoten.neu > div, .knoten.cur > div, .knoten.swap > div { color: #0d1530; }
  }
  .marken { position: absolute; left: 0; bottom: 100%; margin-bottom: 2px; display: flex; gap: 3px; white-space: nowrap; }
  .marken span { font-size: 10px; line-height: 1; padding: 2px 4px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); color: var(--text); font-family: ui-monospace, Consolas, monospace; }
  .marken span.first { border-color: var(--cur); color: var(--cur); font-weight: 700; }
  .pfeil { padding: 0 4px 6px; color: var(--muted); font-size: 15px; line-height: 1; }
  .pfeil.neu { color: var(--neu); font-weight: 700; }
  .null { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); padding-bottom: 7px; }
  .rechnung { margin-top: 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .proto td.op { text-align: left; font-weight: 600; white-space: nowrap; }
  .proto td.inhalt { text-align: left; font-family: ui-monospace, Consolas, monospace; font-size: 12px; white-space: nowrap; }
  .proto td.inhalt span { padding: 0 1px; }
  .proto .p-neu { color: var(--neu); font-weight: 700; }
  .proto .p-besucht { color: var(--text); font-weight: 700; }
  .proto .p-ersetzt { color: var(--swap); font-weight: 700; border: 1.5px solid var(--swap); border-radius: 9px; padding: 0 3px; }
  .proto .p-grau { color: var(--muted); opacity: .6; }
  .proto tr.zuletzt td.op { color: var(--neu); }
  @media (max-width: 480px) {
    .knoten > div { font-size: 12px; padding: 5px 4px; }
    .pfeil { padding: 0 2px 5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="box controls eingabe">
    <label>Schlüssel <input id="schluessel" maxlength="3" value="E"></label>
    <label>Wert <input type="number" id="wert" min="0" max="99" value="7"></label>
    <button id="put">put</button>
    <button id="get">get</button>
    <button id="buch">Testclient SEARCHEXAMPLE</button>
    <button id="leeren">Leeren</button>
  </div>
  <div class="box" id="anzeige">
    <div class="reihe-titel" id="titel"></div>
    <div class="kette" id="kette"></div>
    <div class="rechnung" id="rechnung"></div>
    <div class="legende">
      <span><i style="background:var(--neu)"></i>neuer Knoten</span>
      <span><i style="background:var(--cur)"></i>wird gerade verglichen</span>
      <span><i style="background:var(--bar);outline:2px solid var(--text)"></i>bei der Suche angeschaut</span>
      <span><i style="background:var(--swap)"></i>Wert ersetzt</span>
      <span><i style="background:var(--bar);opacity:.4"></i>nicht mehr berührt</span>
    </div>
  </div>
  <div class="box">
    <div class="controls" style="margin-bottom:10px">
      <div class="group">
        <button id="back" aria-label="Schritt zurück">◀ Zurück</button>
        <button id="play" class="primary">▶ Abspielen</button>
        <button id="next" aria-label="Nächster Schritt">Schritt ▶</button>
        <button id="bis" title="Bis die aktuelle Operation fertig ist">Bis fertig ▶▶</button>
        <button id="neu" title="Alles zurücksetzen wie beim ersten Öffnen">↺ Neu starten</button>
      </div>
      <label>Tempo <input type="range" id="speed" min="1" max="10" value="5"></label>
    </div>
    <div class="msg" id="msg"></div>
    <div class="count" id="count"></div>
  </div>
  <div class="two">
    <div class="box"><div class="h">Java (eigene Fassung, nach Algorithmus 3.1, Listing 3.4)</div><pre id="code"></pre></div>
    <div class="box"><div class="h">Protokoll (wie Abbildung 3.3)</div><div class="proto" id="proto"></div></div>
  </div>
</div>
<script>
(function () {
  const KAP = 16;              // mehr Knoten passen nicht gut auf den Bildschirm – die Liste selbst hätte keine Grenze
  const CODE = [
    'public class SequenzielleSucheST<Key, Value>',
    '{',
    '   private Node first;      // erster Knoten der ungeordneten Liste',
    '   private int n;           // Anzahl der Schlüssel',
    '',
    '   private class Node',
    '   {  // ein Glied: Schlüssel, Wert und Verweis',
    '      Key key;',
    '      Value val;',
    '      Node next;',
    '      Node(Key key, Value val, Node next)',
    '      {  this.key = key;  this.val = val;  this.next = next;  }',
    '   }',
    '',
    '   public Value get(Key key)',
    '   {  // von first aus jeden Knoten vergleichen',
    '      for (Node x = first; x != null; x = x.next)',
    '         if (key.equals(x.key))',
    '            return x.val;              // Treffer: erfolgreiche Suche',
    '      return null;                     // Ende erreicht: erfolglose Suche',
    '   }',
    '',
    '   public void put(Key key, Value val)',
    '   {  // erst suchen: gibt es den Schlüssel schon?',
    '      for (Node y = first; y != null; y = y.next)',
    '         if (key.equals(y.key))',
    '         {  y.val = val;  return;  }   // vorhanden: nur den Wert ersetzen',
    '      first = new Node(key, val, first);   // neu: vorne einfügen',
    '      n++;',
    '   }',
    '',
    '   public int size()  {  return n;  }',
    '',
    '   public static void main(String[] args)',
    '   {  // Testclient: Wert = Position im Wort',
    '      String[] a = "SEARCHEXAMPLE".split("");',
    '      SequenzielleSucheST<String, Integer> st = new SequenzielleSucheST<>();',
    '      for (int i = 0; i < a.length; i++)',
    '         st.put(a[i], i);',
    '   }',
    '}'
  ];
  const zeile = s => CODE.findIndex(l => l.includes(s));
  const L = { start: zeile('private Node first;'),
              getFor: zeile('for (Node x = first'), getIf: zeile('if (key.equals(x.key))'), getTreffer: zeile('return x.val;'), getNull: zeile('return null;'),
              putFor: zeile('for (Node y = first'), putIf: zeile('if (key.equals(y.key))'), putErsetzen: zeile('y.val = val;  return;'),
              putNeu: zeile('first = new Node(key, val, first)'), putN: zeile('n++;'), client: zeile('st.put(a[i], i);') };

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  $('code').innerHTML = CODE.map((l, i) => `<span class="ln" data-i="${i}">${esc(l) || ' '}</span>`).join('');

  // Zustand: liste[0] ist first; jeder Knoten { key, val }
  let liste = [], ops = [], vergleicheGesamt = 0, anzahlOps = 0;
  let steps = [], pos = 0, timer = null;

  // ein Glied der Anzeige: Knoten i der aktuellen Liste mit Klasse und Marken
  const glied = (k, cls, marken, extra) => Object.assign({ key: k.key, val: k.val, cls: cls || '', marken: marken || [] }, extra || {});
  function bild(fn) { const g = liste.map(k => glied(k)); if (g.length) g[0].marken.push('first'); if (fn) fn(g); return g; }
  function snap(line, msg, g, rechnung, o) {
    steps.push(Object.assign({ line, msg, g, rechnung: rechnung || '', n: liste.length, ops: ops.slice(), vergleicheGesamt, anzahlOps }, o));
  }
  // Protokollzeile wie Abbildung 3.3: Liste von first aus, jeder Knoten mit Zustand neu | besucht | ersetzt | grau
  function zeileProto(op, ergebnis, vergl, zustand) { ops.push({ op, ergebnis, vergl, n: liste.length, inhalt: liste.map((k, i) => ({ key: k.key, val: k.val, z: zustand(i) })) }); }

  // sucht key ab first; schreibt je Vergleich einen Schritt; liefert Index des Treffers oder -1
  function suche(key, zeileFor, zeileIf, var_, wofuer) {
    snap(zeileFor, `${wofuer}: ${var_} = first${liste.length ? ` (${liste[0].key})` : ' = null – die Tabelle ist leer'}.`, bild(g => { if (g.length) g[0].marken.push(var_); }));
    for (let i = 0; i < liste.length; i++) {
      vergleicheGesamt++;
      const treffer = liste[i].key === key;
      snap(zeileIf, treffer
        ? `Vergleich ${i + 1}: key.equals(${var_}.key)? „${key}“ = „${liste[i].key}“ → Treffer.`
        : `Vergleich ${i + 1}: key.equals(${var_}.key)? „${key}“ ≠ „${liste[i].key}“ → weiter mit ${var_} = ${var_}.next${i + 1 < liste.length ? ` (${liste[i + 1].key})` : ' = null'}.`,
        bild(g => { for (let j = 0; j < i; j++) g[j].cls = 'besucht'; g[i].cls = 'cur'; g[i].marken.push(var_); }),
        `Vergleiche bei dieser Operation: <b>${i + 1}</b> · insgesamt: <b>${vergleicheGesamt}</b>`);
      if (treffer) return i;
    }
    return -1;
  }

  function put(key, val) {
    anzahlOps++;
    const i = suche(key, L.putFor, L.putIf, 'y', `put(${key}, ${val}): Vor dem Einfügen wird gesucht, ob es „${key}“ schon gibt`);
    const vergl = i < 0 ? liste.length : i + 1;
    if (i >= 0) {
      const alt = liste[i].val;
      liste[i].val = val;
      zeileProto(`put ${key} ${val}`, `${alt} → ${val}`, vergl, j => j < i ? 'besucht' : j === i ? 'ersetzt' : 'grau');
      snap(L.putErsetzen, `„${key}“ gibt es schon: y.val = ${val} ersetzt den alten Wert ${alt}. Kein neuer Knoten – jeder Schlüssel steht höchstens einmal in der Tabelle. Die Knoten hinter dem Treffer werden nicht mehr angeschaut.`,
        bild(g => { for (let j = 0; j < i; j++) g[j].cls = 'besucht'; g[i].cls = 'swap'; g[i].alt = alt; for (let j = i + 1; j < g.length; j++) g[j].cls = 'grau'; }),
        `Vergleiche bei dieser Operation: <b>${vergl}</b> · insgesamt: <b>${vergleicheGesamt}</b>`, { opEnde: true, cls: 'swap' });
      return;
    }
    snap(L.putFor, liste.length
      ? `y = null: Ende der Liste erreicht, „${key}“ ist neu. Dafür mussten alle ${liste.length} Knoten verglichen werden.`
      : `Die Liste ist leer, „${key}“ ist neu – kein einziger Vergleich nötig.`,
      bild(g => g.forEach(x => x.cls = 'besucht')), `Vergleiche bei dieser Operation: <b>${vergl}</b> · insgesamt: <b>${vergleicheGesamt}</b>`);
    liste.unshift({ key, val });
    zeileProto(`put ${key} ${val}`, 'neu', vergl, j => j === 0 ? 'neu' : 'besucht');
    snap(L.putNeu, `first = new Node(${key}, ${val}, first): Der neue Knoten kommt vorne hin, sein next zeigt auf den bisherigen ersten Knoten${liste.length > 1 ? ` (${liste[1].key})` : ' (null)'}.`,
      bild(g => { g[0].cls = 'neu'; g[0].pfeilNeu = true; for (let j = 1; j < g.length; j++) g[j].cls = 'besucht'; }),
      `Vergleiche bei dieser Operation: <b>${vergl}</b> · insgesamt: <b>${vergleicheGesamt}</b>`);
    snap(L.putN, `n++ → n = ${liste.length}.`, bild(g => { g[0].cls = 'neu'; for (let j = 1; j < g.length; j++) g[j].cls = 'besucht'; }),
      `Vergleiche bei dieser Operation: <b>${vergl}</b> · insgesamt: <b>${vergleicheGesamt}</b>`, { opEnde: true, cls: 'neu' });
  }

  function get(key) {
    anzahlOps++;
    const i = suche(key, L.getFor, L.getIf, 'x', `get(${key}): Die Suche beginnt bei first`);
    const vergl = i < 0 ? liste.length : i + 1;
    if (i >= 0) {
      zeileProto(`get ${key}`, String(liste[i].val), vergl, j => j < i ? 'besucht' : j === i ? 'ersetzt' : 'grau');
      snap(L.getTreffer, `Erfolgreiche Suche: return x.val → ${liste[i].val}. ${vergl} Vergleich${vergl === 1 ? '' : 'e'}, der Rest der Liste bleibt unberührt.`,
        bild(g => { for (let j = 0; j < i; j++) g[j].cls = 'besucht'; g[i].cls = 'swap'; for (let j = i + 1; j < g.length; j++) g[j].cls = 'grau'; }),
        `Vergleiche bei dieser Operation: <b>${vergl}</b> · insgesamt: <b>${vergleicheGesamt}</b>`, { opEnde: true, cls: 'swap' });
    } else {
      zeileProto(`get ${key}`, 'null', vergl, () => 'besucht');
      snap(L.getNull, `Erfolglose Suche: x = null, „${key}“ steht nicht in der Tabelle → return null. Dafür wurden alle ${liste.length} Knoten verglichen – eine erfolglose Suche kostet immer die ganze Liste.`,
        bild(g => g.forEach(x => x.cls = 'besucht')), `Vergleiche bei dieser Operation: <b>${vergl}</b> · insgesamt: <b>${vergleicheGesamt}</b>`, { opEnde: true });
    }
  }

  // ---------- Anzeige ----------
  function render() {
    const s = steps[pos];
    $('titel').innerHTML = `Ungeordnete verkettete Liste · n = <b>${s.n}</b> Schlüssel · ${s.anzahlOps} Operation${s.anzahlOps === 1 ? '' : 'en'}`;
    let h = '';
    if (!s.g.length) h = '<span class="null">first → null</span>';
    s.g.forEach((g, i) => {
      const marken = g.marken.length ? `<div class="marken">${g.marken.map(m => `<span class="${m === 'first' ? 'first' : ''}">${m}</span>`).join('')}</div>` : '';
      const val = g.alt !== undefined ? `${esc(g.alt)}→${esc(g.val)}` : esc(g.val);
      h += `<div class="glied"><div class="knoten ${g.cls}">${marken}<div class="key">${esc(g.key)}</div><div class="val">${val}</div><div class="next">•</div></div><span class="pfeil${g.pfeilNeu ? ' neu' : ''}">→</span>`;
      h += i === s.g.length - 1 ? '<span class="null">null</span></div>' : '</div>';
    });
    $('kette').innerHTML = h;
    $('rechnung').innerHTML = s.rechnung || `Vergleiche insgesamt: <b>${s.vergleicheGesamt}</b>`;
    const msg = $('msg');
    msg.textContent = s.msg; msg.className = 'msg' + (s.cls ? ' ' + s.cls : '');
    $('count').innerHTML = `Schritt ${pos + 1} von ${steps.length}`;
    document.querySelectorAll('#code .ln').forEach(el => el.classList.toggle('on', +el.dataset.i === s.line));
    $('proto').innerHTML = s.ops.length
      ? `<table><tr><th style="text-align:left">Operation</th><th>Ergebnis</th><th>Vergl.</th><th style="text-align:left">Liste von first aus</th></tr>${s.ops.map((o, i) =>
        `<tr${i === s.ops.length - 1 && s.opEnde ? ' class="zuletzt"' : ''}><td class="op">${esc(o.op)}</td><td>${esc(o.ergebnis)}</td><td>${o.vergl}</td><td class="inhalt">${o.inhalt.map(k => `<span class="p-${k.z}">${esc(k.key)}${esc(k.val)}</span>`).join(' ')}</td></tr>`).join('')}</table>`
      : '<p class="count">Noch keine Operation. Oben einen Schlüssel mit put eintragen oder den Testclient starten.</p>';
    const amEnde = pos === steps.length - 1;
    $('back').disabled = pos === 0;
    $('next').disabled = amEnde; $('bis').disabled = amEnde;
    stabil($('anzeige')); stabil($('msg'));
    if (amEnde) stop();
  }
  // Kästen werden nie wieder niedriger, sonst springen die Knöpfe darunter auf und ab
  function stabil(el) { const h = el.offsetHeight; if (h > (el._hoch || 0)) { el._hoch = h; el.style.minHeight = h + 'px'; } }
  window.addEventListener('resize', () => ['anzeige', 'msg'].forEach(id => { $(id)._hoch = 0; $(id).style.minHeight = ''; }));

  function stop() { clearInterval(timer); timer = null; $('play').textContent = '▶ Abspielen'; }
  function play() {
    if (pos === steps.length - 1) pos = 0;        // am Ende: von vorn abspielen
    $('play').textContent = '❚❚ Pause';
    timer = setInterval(() => { if (pos < steps.length - 1) { pos++; render(); } else stop(); }, 2000 / +$('speed').value);
    render();
  }
  function operation(f) {
    stop();
    const vorher = steps.length;
    f();
    pos = Math.min(vorher, steps.length - 1);
    render();
  }
  function leeren(text) {
    stop();
    liste = []; ops = []; vergleicheGesamt = 0; anzahlOps = 0; steps = [];
    snap(L.start, text || 'Leere Symboltabelle: first = null, n = 0. Oben einen Schlüssel mit put eintragen.', [], '', { opEnde: true });
    pos = 0; render();
  }
  const WORT = 'SEARCHEXAMPLE';
  function testclient() {
    leeren(`Testclient: Die Buchstaben von ${WORT} kommen nacheinander mit put in die Tabelle, der Wert ist jeweils die Position im Wort (S 0, E 1, A 2 …). Mit „Abspielen“ oder „Schritt“ geht es los.`);
    [...WORT].forEach((c, i) => {
      snap(L.client, `Testclient: st.put(a[${i}], ${i}) – „${c}“ mit Wert ${i}.`, bild(), `Vergleiche insgesamt: <b>${vergleicheGesamt}</b>`);
      put(c, i);
    });
    snap(L.client, `Fertig: ${WORT.length} Eingaben, aber nur ${liste.length} verschiedene Schlüssel – E kam dreimal, A zweimal. Insgesamt ${vergleicheGesamt} Vergleiche. Jedes neue Einfügen kostet einen Vergleich mehr, deshalb wachsen die Kosten quadratisch: rund N²/2 für N Einfügungen.`,
      bild(), `Vergleiche insgesamt: <b>${vergleicheGesamt}</b>`, { opEnde: true });
    pos = 0; render();
  }

  const schluessel = () => $('schluessel').value.trim().toUpperCase();
  $('put').addEventListener('click', () => {
    const k = schluessel(), v = Math.round(+$('wert').value);
    if (!k || !(v >= 0 && v <= 99) || $('wert').value === '') { (k ? $('wert') : $('schluessel')).focus(); return; }
    if (liste.length >= KAP && !liste.some(x => x.key === k)) { $('msg').textContent = `Mehr als ${KAP} Schlüssel passen hier nicht auf den Bildschirm – bitte erst „Leeren“.`; return; }
    operation(() => put(k, v));
  });
  $('get').addEventListener('click', () => { const k = schluessel(); if (!k) { $('schluessel').focus(); return; } operation(() => get(k)); });
  $('schluessel').addEventListener('keydown', e => { if (e.key === 'Enter') $('get').click(); });
  $('wert').addEventListener('keydown', e => { if (e.key === 'Enter') $('put').click(); });
  $('buch').addEventListener('click', testclient);
  $('neu').addEventListener('click', testclient);   // Neustart = Zustand beim ersten Öffnen
  $('leeren').addEventListener('click', () => leeren());
  $('play').addEventListener('click', () => timer ? stop() : play());
  $('next').addEventListener('click', () => { stop(); if (pos < steps.length - 1) { pos++; render(); } });
  $('back').addEventListener('click', () => { stop(); if (pos > 0) { pos--; render(); } });
  $('bis').addEventListener('click', () => { stop(); do { pos++; } while (pos < steps.length - 1 && !steps[pos].opEnde); render(); });
  $('speed').addEventListener('input', () => { if (timer) { stop(); play(); } });

  // für automatische Tests
  window.__st = { put: (k, v) => operation(() => put(k, v)), get: k => { operation(() => get(k)); return ops[ops.length - 1].ergebnis; },
    leeren: () => leeren(), testclient, get liste() { return liste.map(k => ({ ...k })); }, get steps() { return steps; }, get ops() { return ops; },
    get vergleiche() { return vergleicheGesamt; }, KAP, CODE };

  testclient();
})();
</script>
</body>
</html>
