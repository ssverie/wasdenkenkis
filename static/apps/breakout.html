<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #10101e; color: #e8e8f2;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 16px;
  }
  h1 { letter-spacing: 5px; font-size: 24px; background: linear-gradient(90deg,#ff5f6d,#ffc371); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hud { display: flex; gap: 28px; font-size: 15px; color: #9a9ab4; }
  .hud b { color: #fff; font-variant-numeric: tabular-nums; }
  canvas { border: 3px solid #2e2e52; border-radius: 10px; background: #0a0a16; box-shadow: 0 0 40px #22224466; }
  .hint { font-size: 12px; color: #9a9ab4; text-align: center; line-height: 1.7; }
  /* wasdenkenkis.de: Spielfeld skaliert mit der Breite (die Maus-Umrechnung im Spiel berücksichtigt das bereits) */
  canvas { max-width: 100%; height: auto; touch-action: none; }
  @media (max-width: 520px) { body { padding: 8px; justify-content: flex-start; } h1 { font-size: 20px; }
    .hud { display: block; text-align: center; font-size: 14px; } }
</style>
</head>
<body>
  <h1>BREAKOUT</h1>
  <div class="hud">
    Punkte <b id="score">0</b> · Level <b id="level">1</b> · Leben <b id="lives">3</b> · Bestwert <b id="best">0</b>
  </div>
  <canvas id="cv" width="720" height="520"></canvas>
  <div class="hint">
    <b>Maus</b> oder <b>← →</b> bewegen das Paddle · <b>Leertaste / Klick</b> startet den Ball ·
    <b>Handy:</b> Finger übers Spielfeld ziehen, Tippen startet ·
    Power-Ups fallen aus manchen Steinen: <span style="color:#4dd">▬ breites Paddle</span>, <span style="color:#f66">♥ Extra-Leben</span>, <span style="color:#fd6">● langsamer Ball</span>
  </div>

<script>
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  const BRICK_COLS = 12, BRICK_ROWS = 7, BRICK_H = 22, BRICK_GAP = 4, TOP = 60;
  const BRICK_W = (W - BRICK_GAP*(BRICK_COLS+1)) / BRICK_COLS;
  const ROW_COLORS = ['#ff5f6d','#ff8c5a','#ffc371','#ffe66d','#7bd88f','#4dd0e1','#9d8df1'];

  const paddle = { w: 110, h: 14, x: W/2-55, y: H-34, speed: 9 };
  const ball = { x: W/2, y: H-50, r: 8, vx: 0, vy: 0, speed: 6, stuck: true };
  let bricks, score, lives, level, best, powerups, state, keys = {}, wideTimer = 0;

  best = +(localStorage.getItem('breakoutBest') || 0);
  document.getElementById('best').textContent = best;

  function buildLevel() {
    bricks = [];
    for (let r=0; r<BRICK_ROWS; r++) for (let c=0; c<BRICK_COLS; c++) {
      // Ab Level 2: einige Steine brauchen 2 Treffer (obere Reihen)
      const hits = (level >= 2 && r < 2) ? 2 : 1;
      bricks.push({
        x: BRICK_GAP + c*(BRICK_W+BRICK_GAP),
        y: TOP + r*(BRICK_H+BRICK_GAP),
        color: ROW_COLORS[r % ROW_COLORS.length],
        hits,
        power: Math.random() < 0.12 ? ['wide','life','slow'][Math.floor(Math.random()*3)] : null
      });
    }
  }

  function resetBall() {
    ball.stuck = true;
    ball.speed = 5.5 + (level-1)*0.7;
    ball.vx = 0; ball.vy = 0;
  }

  function launch() {
    if (state === 'over' || state === 'win') { newGame(); return; }
    if (ball.stuck) {
      ball.stuck = false;
      const a = -Math.PI/3 - Math.random()*Math.PI/3;   // schräg nach oben
      ball.vx = ball.speed * Math.cos(a);
      ball.vy = ball.speed * Math.sin(a);
    }
  }

  function newGame() {
    score = 0; lives = 3; level = 1; powerups = []; wideTimer = 0;
    paddle.w = 110;
    state = 'play';
    buildLevel(); resetBall(); hud();
  }

  function hud() {
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = lives;
    document.getElementById('level').textContent = level;
    document.getElementById('best').textContent = best;
  }

  // ---- Sound (Web Audio) ----
  let actx = null;
  function blip(freq, dur=0.06) {
    try {
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = freq; o.type = 'square';
      g.gain.setValueAtTime(0.06, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch(e) {}
  }

  // ---- Update ----
  function update() {
    if (state !== 'play') return;

    // Paddle per Tastatur
    if (keys.ArrowLeft)  paddle.x -= paddle.speed;
    if (keys.ArrowRight) paddle.x += paddle.speed;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (wideTimer > 0 && --wideTimer === 0) paddle.w = 110;

    if (ball.stuck) { ball.x = paddle.x + paddle.w/2; ball.y = paddle.y - ball.r - 2; }
    else {
      ball.x += ball.vx; ball.y += ball.vy;
      // Wände
      if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -1; blip(220); }
      if (ball.x > W-ball.r) { ball.x = W-ball.r; ball.vx *= -1; blip(220); }
      if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -1; blip(220); }
      // Paddle
      if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y < paddle.y + paddle.h &&
          ball.x > paddle.x - ball.r && ball.x < paddle.x + paddle.w + ball.r) {
        const rel = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);   // -1..1
        const a = rel * (Math.PI * 0.36) - Math.PI/2;                     // Winkel um senkrecht
        const sp = Math.min(ball.speed + 0.15, 11);
        ball.speed = sp;
        ball.vx = sp * Math.cos(a + Math.PI/2 - Math.PI/2) * Math.sign(rel || 0.3);
        ball.vx = sp * Math.sin(rel * Math.PI * 0.36);
        ball.vy = -Math.abs(sp * Math.cos(rel * Math.PI * 0.36));
        ball.y = paddle.y - ball.r;
        blip(330);
      }
      // Ball verloren
      if (ball.y > H + 20) {
        lives--; hud(); blip(110, .2);
        if (lives <= 0) { gameOver(); } else resetBall();
      }
      // Steine
      for (const b of bricks) {
        if (b.hits <= 0) continue;
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + BRICK_W &&
            ball.y + ball.r > b.y && ball.y - ball.r < b.y + BRICK_H) {
          // Kollisionsseite grob bestimmen
          const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BRICK_W - (ball.x - ball.r));
          const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BRICK_H - (ball.y - ball.r));
          if (overlapX < overlapY) ball.vx *= -1; else ball.vy *= -1;
          b.hits--;
          if (b.hits <= 0) {
            score += 10; blip(520);
            if (b.power) powerups.push({ x: b.x + BRICK_W/2, y: b.y + BRICK_H/2, vy: 2.4, type: b.power });
          } else { score += 5; blip(440); }
          hud();
          break;
        }
      }
      // Level geschafft?
      if (bricks.every(b => b.hits <= 0)) {
        level++;
        if (level > 5) { state = 'win'; if (score > best) { best = score; localStorage.setItem('breakoutBest', best); } hud(); return; }
        buildLevel(); resetBall(); hud(); blip(700,.15);
      }
    }

    // Power-Ups fallen
    for (const p of powerups) {
      p.y += p.vy;
      if (p.y > paddle.y - 6 && p.y < paddle.y + paddle.h + 10 &&
          p.x > paddle.x && p.x < paddle.x + paddle.w) {
        p.caught = true; blip(620, .12);
        if (p.type==='wide') { paddle.w = 170; wideTimer = 60*12; paddle.x = Math.min(paddle.x, W-paddle.w); }
        if (p.type==='life') { lives++; hud(); }
        if (p.type==='slow') { ball.speed = Math.max(4.5, ball.speed - 2); const s = Math.hypot(ball.vx,ball.vy)||1; ball.vx *= ball.speed/s; ball.vy *= ball.speed/s; }
      }
    }
    powerups = powerups.filter(p => !p.caught && p.y < H + 20);
  }

  function gameOver() {
    state = 'over';
    if (score > best) { best = score; localStorage.setItem('breakoutBest', best); }
    hud();
  }

  // ---- Draw ----
  function draw() {
    ctx.clearRect(0,0,W,H);
    // Steine
    for (const b of bricks) {
      if (b.hits <= 0) continue;
      ctx.fillStyle = b.color;
      ctx.globalAlpha = b.hits === 2 ? 1 : (b.hits === 1 && level >= 2 ? 0.9 : 1);
      ctx.fillRect(b.x, b.y, BRICK_W, BRICK_H);
      if (b.hits === 2) { ctx.strokeStyle = '#fff8'; ctx.lineWidth = 2; ctx.strokeRect(b.x+2, b.y+2, BRICK_W-4, BRICK_H-4); }
      ctx.globalAlpha = 1;
    }
    // Paddle
    const grad = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.w, 0);
    grad.addColorStop(0,'#4dd0e1'); grad.addColorStop(1,'#9d8df1');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7); ctx.fill();
    // Ball
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    // Power-Ups
    for (const p of powerups) {
      ctx.font = '16px "Segoe UI"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (p.type==='wide') { ctx.fillStyle='#4dd0e1'; ctx.fillText('▬', p.x, p.y); }
      if (p.type==='life') { ctx.fillStyle='#ff6b6b'; ctx.fillText('♥', p.x, p.y); }
      if (p.type==='slow') { ctx.fillStyle='#ffe66d'; ctx.fillText('●', p.x, p.y); }
    }
    // Texte
    ctx.fillStyle = '#c8c8e0'; ctx.font = '17px "Segoe UI"'; ctx.textAlign = 'center';
    if (state==='play' && ball.stuck) ctx.fillText('Leertaste, Klick oder Tippen zum Start', W/2, H-70);   // „Tippen“ ergänzt (wasdenkenkis.de)
    if (state==='over') {
      ctx.font = '38px "Segoe UI"'; ctx.fillStyle='#ff6b6b'; ctx.fillText('GAME OVER', W/2, H/2);
      ctx.font = '16px "Segoe UI"'; ctx.fillStyle='#c8c8e0'; ctx.fillText(score + ' Punkte · Leertaste = neu', W/2, H/2 + 36);
    }
    if (state==='win') {
      ctx.font = '38px "Segoe UI"'; ctx.fillStyle='#7bd88f'; ctx.fillText('🏆 ALLE LEVEL GESCHAFFT!', W/2, H/2);
      ctx.font = '16px "Segoe UI"'; ctx.fillStyle='#c8c8e0'; ctx.fillText(score + ' Punkte · Leertaste = neu', W/2, H/2 + 36);
    }
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }

  // ---- Eingabe ----
  cv.addEventListener('mousemove', e => {
    const r = cv.getBoundingClientRect();
    paddle.x = Math.max(0, Math.min(W - paddle.w, (e.clientX - r.left) * (W/r.width) - paddle.w/2));
  });
  cv.addEventListener('click', launch);
  // wasdenkenkis.de: Touch – Paddle folgt dem Finger, Antippen startet den Ball (ohne dass die Seite scrollt)
  function touchPaddle(e) {
    const t = e.touches[0]; if (!t) return;
    const r = cv.getBoundingClientRect();
    paddle.x = Math.max(0, Math.min(W - paddle.w, (t.clientX - r.left) * (W/r.width) - paddle.w/2));
  }
  cv.addEventListener('touchstart', e => { e.preventDefault(); touchPaddle(e); launch(); }, { passive: false });
  cv.addEventListener('touchmove',  e => { e.preventDefault(); touchPaddle(e); }, { passive: false });
  document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ') { e.preventDefault(); launch(); }
    if (e.key.startsWith('Arrow')) e.preventDefault();
  });
  document.addEventListener('keyup', e => keys[e.key] = false);

  newGame();
  loop();
</script>
</body>
</html>
